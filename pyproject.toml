[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thorn-math"
version = "0.1.0"
description = "Partial mathematical elaboration and AI-assisted review for LaTeX manuscripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "openai>=2.47.0",
  "pydantic>=2.10",
  "spacy==3.8.14",
]

[project.optional-dependencies]
pylatexenc = [
  "pylatexenc==2.10",
]
treesitter = [
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.14.3",
]
dev = [
  "hatchling>=1.27",
  "mypy>=1.15",
  "pylatexenc==2.10",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
thorn = "thorn.cli:main"
thorn-eval = "thorn.eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thorn"]

[tool.hatch.build]
include = [
  "src/thorn/**/*.py",
  "src/thorn/prompts/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["thorn", "declaration_contract_frontend"]

[tool.ruff.lint.per-file-ignores]
"src/thorn/proof_visualizer_assets.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["thorn"]

[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter_language_pack"]
ignore_missing_imports = true
