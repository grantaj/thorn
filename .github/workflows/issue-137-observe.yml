name: TEMP observe issue 137 sentinel follow-up

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect issue 137 sentinel follow-up runs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'thorn-issue-137-observer',
          }
          params = urllib.parse.urlencode({
              'branch': 'agent/issue-137-schema-transport',
              'event': 'push',
              'per_page': 10,
          })
          url = f'https://api.github.com/repos/{repo}/actions/workflows/issue-137-sentinel-followup.yml/runs?{params}'
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=60) as response:
              runs = json.load(response).get('workflow_runs', [])
          print('RUNS')
          print(json.dumps([
              {
                  'id': run.get('id'),
                  'head_sha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
              }
              for run in runs
          ], indent=2, sort_keys=True))
          for run in runs[:3]:
              run_id = int(run['id'])
              jobs_request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100',
                  headers=headers,
              )
              with urllib.request.urlopen(jobs_request, timeout=60) as response:
                  jobs = json.load(response).get('jobs', [])
              print(f'JOBS {run_id}')
              print(json.dumps([
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'steps': [
                          {
                              'name': step.get('name'),
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps', [])
                      ],
                  }
                  for job in jobs
              ], indent=2, sort_keys=True))
          PY
