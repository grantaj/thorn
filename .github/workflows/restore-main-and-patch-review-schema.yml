name: Restore main review code and patch schema

on:
  push:
    branches:
      - agent/proof-review-v2-sentinel

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'apply isolated review schema repair'
    runs-on: ubuntu-latest
    env:
      FUNCTION_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore current-main implementation and apply only array-schema repair
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          main = subprocess.check_output(
              ['git', 'show', 'FETCH_HEAD:src/thorn/proof_language_review.py'],
              text=True,
          )
          start_marker = '@lru_cache(maxsize=256)\ndef _closed_world_response_model('
          end_marker = '\n\nclass ProofReviewTurnRequest'
          start = main.index(start_marker)
          end = main.index(end_marker, start)
          replacement = base64.b64decode(os.environ['FUNCTION_B64']).decode()
          Path('src/thorn/proof_language_review.py').write_text(
              main[:start] + replacement + main[end:]
          )
          PY
          rm .github/workflows/restore-main-and-patch-review-schema.yml
      - name: Commit isolated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/thorn/proof_language_review.py .github/workflows/restore-main-and-patch-review-schema.yml
          git commit -m 'fix transport-valid review arrays'
          git push origin HEAD:agent/proof-review-v2-sentinel
