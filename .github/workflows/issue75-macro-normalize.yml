name: Validate issue 75 macro normalization

on:
  push:
    branches:
      - agent/issue-75-proof-ir-context-fidelity
    paths:
      - .github/workflows/issue75-macro-normalize.yml

permissions:
  contents: write

env:
  OPENAI_API_KEY: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-75-proof-ir-context-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply normalization patch
        run: python scripts/issue75_macro_normalize_patch.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Issue 75 regressions
        run: pytest -q tests/test_proof_ir_context_fidelity.py
      - name: Full keyless suite
        run: pytest -q
      - name: Corpus and CLI checks
        run: |
          thorn-eval eval/cases --validate-only
          thorn-eval eval/cases --analyze
          thorn analyze examples/demo.tex --structural-only
          thorn ir examples/demo.tex --structural-only --format json > /tmp/thorn-ir.json
      - name: Static checks
        run: |
          ruff check src tests
          mypy src
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue75-macro-normalize.yml scripts/issue75_macro_normalize_patch.py
          git add src/thorn/symbol_extract.py tests/test_proof_ir_context_fidelity.py
          git commit -m "Canonicalize definitional operator macros"
          git push origin HEAD:agent/issue-75-proof-ir-context-fidelity
