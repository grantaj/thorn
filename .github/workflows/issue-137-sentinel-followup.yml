name: TEMP issue 137 sentinel follow-up

on:
  push:
    branches:
      - agent/issue-137-schema-transport

permissions:
  contents: write

jobs:
  sentinel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-137-schema-transport
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python .github/issue137_sentinel_followup.py
      - name: Install Thorn and local NLP model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m spacy download en_core_web_sm
      - name: Test sentinel and frozen experiment gates
        run: |
          pytest -q tests/test_proof_review_v2_sentinel.py tests/test_issue_101_live_preflight.py tests/test_issue_101_robustness.py tests/test_issue_134_pre125_freeze.py
          python scripts/prepare_proof_review_sentinel.py --output /tmp/proof-review-v2-sentinel.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/proof-review-v2-sentinel.json').read_text())
          assert payload['frozen_request_contract_verified'] is False
          assert payload['frozen_request_contract_matches_current'] is False
          assert payload['comparable_to_frozen_paid_run'] is False
          assert payload['request_contract_drift']
          assert payload['provider_instantiated'] is False
          assert payload['provider_requests'] == 0
          assert payload['live_requests'] == 0
          PY
      - run: ruff check src/thorn/proof_review_sentinel.py tests/test_proof_review_v2_sentinel.py
      - run: mypy src
      - name: Commit tested sentinel handling and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-137-sentinel-followup.yml .github/issue137_sentinel_followup.py
          git add src/thorn/proof_review_sentinel.py tests/test_proof_review_v2_sentinel.py eval/proof-review-v2-sentinel/README.md
          git commit -m "Report historical sentinel contract drift keylessly"
          git push origin HEAD:agent/issue-137-schema-transport
