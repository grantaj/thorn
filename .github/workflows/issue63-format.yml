name: Issue 63 format

on:
  push:
    branches:
      - agent/issue-63-higher-proof-structure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-63-higher-proof-structure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Format issue 63 files
        run: |
          ruff format src/thorn/higher_proof_structure.py tests/test_higher_proof_structure.py
          ruff check src/thorn/higher_proof_structure.py tests/test_higher_proof_structure.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/higher_proof_structure.py tests/test_higher_proof_structure.py
          git commit -m "Format higher proof structure"
          git push origin HEAD:agent/issue-63-higher-proof-structure
