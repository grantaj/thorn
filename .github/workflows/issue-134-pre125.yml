name: Issue 134 pre-125 robustness continuation

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Run separately authorized paid A1/A2/A3 batch after keyless preflight
        required: true
        default: false
        type: boolean

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .
      - name: Verify frozen post-132/pre-125 requests and bounds
        run: |
          python scripts/run_issue_134_pre125.py \
            --preflight \
            --output "$RUNNER_TEMP/issue-134-preflight.json"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-134-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-134-preflight.json
          if-no-files-found: error

  live:
    if: ${{ inputs.confirm_live }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .
      - name: Run separately authorized frozen paid A1/A2/A3 batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue-134/recordings" "$RUNNER_TEMP/issue-134/reports"
          python scripts/run_issue_134_pre125.py \
            --live \
            --record-dir "$RUNNER_TEMP/issue-134/recordings" \
            --report-dir "$RUNNER_TEMP/issue-134/reports" \
            --output "$RUNNER_TEMP/issue-134/live.json"
      - name: Verify exact keyless replay
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/issue-134/replay-reports"
          python scripts/run_issue_134_pre125.py \
            --replay-dir "$RUNNER_TEMP/issue-134/recordings" \
            --report-dir "$RUNNER_TEMP/issue-134/replay-reports" \
            --output "$RUNNER_TEMP/issue-134/replay.json"
      - name: Preserve live and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-134-live-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-134
          if-no-files-found: error
