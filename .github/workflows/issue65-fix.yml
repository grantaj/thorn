name: Issue 65 maintenance

on:
  push:
    branches:
      - agent/issue-65-llm-proof-language

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-65-llm-proof-language
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded issue 65 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/thorn/llm_proof_language.py")
          text = path.read_text()
          text = text.replace(
              "from pydantic import BaseModel, ConfigDict, Field",
              "from pydantic import BaseModel, ConfigDict",
              1,
          )
          text = text.replace(
              "    ProofRuleKind,\n    PropositionRole,",
              "    ProofRuleKind,\n    ProofStepEdge,\n    PropositionRole,",
              1,
          )
          text = text.replace(
              "def _steps_by_target(ir: SemanticTransformationIR) -> dict[str, list[object]]:\n"
              "    result: dict[str, list[object]] = {}",
              "def _steps_by_target(\n"
              "    ir: SemanticTransformationIR,\n"
              ") -> dict[str, list[ProofStepEdge]]:\n"
              "    result: dict[str, list[ProofStepEdge]] = {}",
              1,
          )
          path.write_text(text)
          PY
          python -m pip install ruff mypy pydantic
          ruff check src/thorn/llm_proof_language.py --fix
          ruff format src/thorn/llm_proof_language.py tests/test_llm_proof_language.py scripts/measure_llm_proof_language.py
          ruff check src/thorn/llm_proof_language.py tests/test_llm_proof_language.py scripts/measure_llm_proof_language.py
      - name: Commit bounded fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/llm_proof_language.py tests/test_llm_proof_language.py scripts/measure_llm_proof_language.py
          git commit -m "Fix proof language lint and typing"
          git push origin HEAD:agent/issue-65-llm-proof-language
