name: TEMP harvest issue 134 live evidence

on:
  push:
    branches:
      - agent/issue-134-live-authorized

permissions:
  actions: read
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      TARGET_RUN_SHA: 28feb52af0095995c00610ef8e6ceafdfdb5ab03
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-134-live-authorized
      - name: Wait for the single authorized run and download its evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import zipfile
          from io import BytesIO
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_sha = os.environ['TARGET_RUN_SHA']
          api = 'https://api.github.com'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'thorn-issue-134-harvest',
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          params = urllib.parse.urlencode({
              'branch': 'agent/issue-134-live-authorized',
              'event': 'push',
              'per_page': 50,
          })
          runs_url = f'{api}/repos/{repo}/actions/workflows/issue-134-pre125.yml/runs?{params}'
          run = None
          for _ in range(80):
              payload = get_json(runs_url)
              matches = [item for item in payload.get('workflow_runs', []) if item.get('head_sha') == target_sha]
              if matches:
                  run = matches[0]
                  if run.get('status') == 'completed':
                      break
              time.sleep(15)
          if run is None:
              raise SystemExit(f'authorized workflow run for {target_sha} was not found')
          if run.get('status') != 'completed':
              raise SystemExit(f'authorized workflow run did not complete: {run.get("status")}')

          run_id = int(run['id'])
          root = Path('eval/robustness/issue_134/live_evidence') / f'run-{run_id}'
          root.mkdir(parents=True, exist_ok=True)
          (root / 'run.json').write_text(json.dumps(run, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          jobs = get_json(f'{api}/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')
          (root / 'jobs.json').write_text(json.dumps(jobs, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          artifacts = get_json(f'{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          (root / 'artifacts.json').write_text(json.dumps(artifacts, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          for artifact in artifacts.get('artifacts', []):
              if artifact.get('expired'):
                  continue
              artifact_id = int(artifact['id'])
              name = str(artifact['name'])
              request = urllib.request.Request(
                  f'{api}/repos/{repo}/actions/artifacts/{artifact_id}/zip',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              destination = root / name
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(BytesIO(data)) as archive:
                  archive.extractall(destination)

          metadata = {
              'issue': 134,
              'experiment_id': 'issue-134-pre-125',
              'authorized_trigger_sha': target_sha,
              'run_id': run_id,
              'run_status': run.get('status'),
              'run_conclusion': run.get('conclusion'),
              'head_branch': run.get('head_branch'),
              'head_sha': run.get('head_sha'),
              'event': run.get('event'),
          }
          (root / 'HARVEST.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY
      - name: Preserve evidence on the temporary execution branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/robustness/issue_134/live_evidence
          if git diff --cached --quiet; then
            echo "No evidence changes to preserve"
            exit 0
          fi
          git commit -m "TEMP: preserve issue 134 authorized live evidence"
          git push origin HEAD:agent/issue-134-live-authorized
