name: Local NLP contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/nlp.yml"
      - "pyproject.toml"
      - "src/thorn/analysis.py"
      - "src/thorn/canonical_typed_proof_ir.py"
      - "src/thorn/cli.py"
      - "src/thorn/eval.py"
      - "src/thorn/eval_review.py"
      - "src/thorn/evidence.py"
      - "src/thorn/formula_ir.py"
      - "src/thorn/higher_proof_structure.py"
      - "src/thorn/latex.py"
      - "src/thorn/linguistic*.py"
      - "src/thorn/llm_proof_language.py"
      - "src/thorn/local_nlp.py"
      - "src/thorn/proof_language*.py"
      - "src/thorn/proof_review_eval.py"
      - "src/thorn/proof_review_sentinel.py"
      - "src/thorn/proof_obligations.py"
      - "src/thorn/proof_skeleton.py"
      - "src/thorn/providers/**"
      - "src/thorn/prompts/proof_language_reviewer_v1.md"
      - "src/thorn/prompts/proof_language_reviewer_v2.md"
      - "src/thorn/result_application.py"
      - "src/thorn/review_workflow.py"
      - "src/thorn/semantic_experiment.py"
      - "src/thorn/semantic_projection.py"
      - "src/thorn/semantic_review.py"
      - "src/thorn/semantic_review_compact.py"
      - "src/thorn/semantic_transformations.py"
      - "src/thorn/support*.py"
      - "src/thorn/symbol_resolution_ir.py"
      - "src/thorn/symbols.py"
      - "examples/quickstart/**"
      - "eval/HIGHER_PROOF_STRUCTURE.md"
      - "eval/LLM_PROOF_LANGUAGE.md"
      - "eval/PROOF_LANGUAGE_REVIEW.md"
      - "eval/README.md"
      - "eval/IR_VALUE_EXPERIMENT.md"
      - "eval/PROOF_OBLIGATIONS.md"
      - "eval/SEMANTIC_TRANSFORMATIONS.md"
      - "eval/SKELETON_COMPRESSION.md"
      - "eval/SYMBOL_SCOPE_RESOLUTION.md"
      - "eval/TYPED_FORMULA_IR.md"
      - "eval/ir-value-challenge.json"
      - "eval/lean-replay-opportunity-public.json"
      - "eval/proof-review-challenge.json"
      - "eval/proof-review-v2-sentinel/**"
      - "scripts/measure_lean_replay_opportunity.py"
      - "scripts/measure_llm_proof_language.py"
      - "scripts/measure_skeleton_compression.py"
      - "scripts/measure_typed_formula_ir.py"
      - "scripts/prepare_ir_value_experiment.py"
      - "scripts/prepare_proof_review_experiment.py"
      - "scripts/prepare_proof_review_sentinel.py"
      - "scripts/run_proof_review_experiment.py"
      - "scripts/run_proof_review_sentinel.py"
      - "research/semantic-parser-bakeoff/**"
      - "tests/test_canonical_typed_proof_ir.py"
      - "tests/test_cli_analysis.py"
      - "tests/test_eval*.py"
      - "tests/test_formula_ir.py"
      - "tests/test_higher_proof_structure.py"
      - "tests/test_issue_119_explicit_proof_citations.py"
      - "tests/test_linguistic_*.py"
      - "tests/test_llm_proof_language.py"
      - "tests/test_proof_language_review.py"
      - "tests/test_proof_review_experiment.py"
      - "tests/test_proof_review_v2_sentinel.py"
      - "tests/test_proof_obligations.py"
      - "tests/test_proof_skeleton.py"
      - "tests/test_quickstart_examples.py"
      - "tests/test_result_application.py"
      - "tests/test_semantic_dependency_contract.py"
      - "tests/test_semantic_dependency_local_nlp_contract.py"
      - "tests/test_semantic_projection.py"
      - "tests/test_semantic_experiment.py"
      - "tests/test_semantic_transformations.py"
      - "tests/test_symbol_resolution*.py"

jobs:
  spacy-contract:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Thorn and the local English model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m spacy download en_core_web_sm
      - name: Run parser-neutral unit contracts
        run: |
          pytest -q tests/test_semantic_projection.py tests/test_linguistic_*.py tests/test_cli_analysis.py tests/test_eval_preflight.py tests/test_semantic_experiment.py tests/test_proof_skeleton.py tests/test_proof_obligations.py tests/test_symbol_resolution*.py tests/test_higher_proof_structure.py tests/test_semantic_transformations.py tests/test_result_application.py tests/test_llm_proof_language.py tests/test_proof_language_review.py tests/test_proof_review_experiment.py tests/test_proof_review_v2_sentinel.py tests/test_quickstart_examples.py tests/test_issue_119_explicit_proof_citations.py
      - name: Run semantic-dependency Local NLP conformance
        run: |
          pytest -q tests/test_semantic_dependency_contract.py \
            tests/test_semantic_dependency_local_nlp_contract.py
      - name: Check Thorn-owned spaCy behavior over the 70-case corpus
        run: python research/semantic-parser-bakeoff/check_spacy_contract.py
      - name: Exercise the normal CLI linguistic path
        run: |
          thorn analyze examples/demo.tex --fail-on never
          thorn analyze examples/quickstart/clean/paper.tex --fail-on never
          thorn analyze examples/quickstart/structural-problem/paper.tex --fail-on never
          thorn analyze examples/quickstart/mathematical-problem/paper.tex --fail-on never
      - name: Run keyless C2 targeted preflight
        run: |
          thorn-eval eval/cases --targeted-preflight --case-filter clean_nonzero_cancellation
          thorn-eval eval/cases --targeted-preflight --case-filter missing_nonzero_hypothesis
          thorn-eval eval/cases --targeted-preflight --case-filter clean_quotient_map
          thorn-eval eval/cases --targeted-preflight --case-filter quotient_map_not_well_defined
          thorn-eval eval/cases --targeted-preflight --case-filter rolle_gap
          thorn-eval eval/cases --targeted-preflight --case-filter bad_lemma_breaks_theorem
      - name: Build keyless IR-value experiment inventory
        run: python scripts/prepare_ir_value_experiment.py
      - name: Measure source-addressable skeleton compression
        run: |
          python scripts/measure_skeleton_compression.py --output /tmp/skeleton-compression.json
      - name: Measure stable LLM proof language
        run: |
          python scripts/measure_llm_proof_language.py --output /tmp/llm-proof-language.json
      - name: Build keyless proof-review A/B/C inventory
        run: |
          python scripts/prepare_proof_review_experiment.py --output /tmp/proof-review-inventory.json
      - name: Build keyless issue-115 Lean replay opportunity inventory
        run: |
          python scripts/measure_lean_replay_opportunity.py \
            --thorn-revision "$GITHUB_SHA" \
            --output /tmp/lean-replay-opportunity.json
      - name: Upload issue-115 Lean replay opportunity inventory
        uses: actions/upload-artifact@v4
        with:
          name: lean-replay-opportunity-${{ github.sha }}
          path: /tmp/lean-replay-opportunity.json
          if-no-files-found: error
      - name: Build keyless post-#90 v2 sentinel inventory
        run: |
          python scripts/prepare_proof_review_sentinel.py --output /tmp/proof-review-v2-sentinel.json
      - name: Upload post-#90 v2 sentinel inventory
        uses: actions/upload-artifact@v4
        with:
          name: proof-review-v2-sentinel-${{ github.sha }}
          path: /tmp/proof-review-v2-sentinel.json
          if-no-files-found: error
