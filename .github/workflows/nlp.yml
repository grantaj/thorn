name: Local NLP contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/nlp.yml"
      - "pyproject.toml"
      - "src/thorn/analysis.py"
      - "src/thorn/cli.py"
      - "src/thorn/eval.py"
      - "src/thorn/eval_review.py"
      - "src/thorn/evidence.py"
      - "src/thorn/latex.py"
      - "src/thorn/linguistic*.py"
      - "src/thorn/local_nlp.py"
      - "src/thorn/semantic_experiment.py"
      - "src/thorn/semantic_projection.py"
      - "src/thorn/semantic_review.py"
      - "src/thorn/semantic_review_compact.py"
      - "src/thorn/support*.py"
      - "src/thorn/symbols.py"
      - "eval/README.md"
      - "eval/IR_VALUE_EXPERIMENT.md"
      - "eval/ir-value-challenge.json"
      - "scripts/prepare_ir_value_experiment.py"
      - "research/semantic-parser-bakeoff/**"
      - "tests/test_cli_analysis.py"
      - "tests/test_eval*.py"
      - "tests/test_linguistic_*.py"
      - "tests/test_semantic_experiment.py"
      - "tests/test_semantic_projection.py"

jobs:
  spacy-contract:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Thorn and the local English model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m spacy download en_core_web_sm
      - name: Run parser-neutral unit contracts
        run: |
          pytest -q tests/test_semantic_projection.py tests/test_linguistic_*.py tests/test_cli_analysis.py tests/test_eval_preflight.py tests/test_semantic_experiment.py
      - name: Check Thorn-owned spaCy behavior over the 70-case corpus
        run: python research/semantic-parser-bakeoff/check_spacy_contract.py
      - name: Exercise the normal CLI linguistic path
        run: thorn analyze examples/demo.tex --fail-on never
      - name: Run keyless C2 targeted preflight
        run: |
          thorn-eval eval/cases --targeted-preflight --case-filter clean_nonzero_cancellation
          thorn-eval eval/cases --targeted-preflight --case-filter missing_nonzero_hypothesis
          thorn-eval eval/cases --targeted-preflight --case-filter clean_quotient_map
          thorn-eval eval/cases --targeted-preflight --case-filter quotient_map_not_well_defined
          thorn-eval eval/cases --targeted-preflight --case-filter rolle_gap
          thorn-eval eval/cases --targeted-preflight --case-filter bad_lemma_breaks_theorem
      - name: Build keyless IR-value experiment inventory
        run: python scripts/prepare_ir_value_experiment.py
