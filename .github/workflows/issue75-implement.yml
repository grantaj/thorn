name: Issue 75 implementation

on:
  push:
    branches:
      - agent/issue-75-proof-ir-context-fidelity

permissions:
  contents: write

env:
  OPENAI_API_KEY: ""

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-75-proof-ir-context-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply bounded fidelity tranche
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/thorn/support_extract.py",
              '''_REFERENCE_SUPPORT_CUE_RE = re.compile(
              r"\\b(?:by|from|using|apply|applying|invoke|invoking)\\b",
              re.IGNORECASE,
          )
          _BOUND_NAME_RE = re.compile(
          ''',
              '''_REFERENCE_SUPPORT_CUE_RE = re.compile(
              r"\\b(?:by|from|using|apply|applying|invoke|invoking)\\b",
              re.IGNORECASE,
          )
          _ASSERTED_SUPPORT_RE = re.compile(
              r"^\\s*(?:by|using|from|applying|apply|invoking|invoke)\\s+(.+?),\\s*(.+)$",
              re.IGNORECASE | re.DOTALL,
          )
          _BOUND_NAME_RE = re.compile(
          ''',
          )

          replace_once(
              "src/thorn/support_extract.py",
              '''    for property_match in _NAMED_PROPERTY_RE.finditer(raw):
                  start = claim.source.start_offset + property_match.start()
                  end = claim.source.start_offset + property_match.end()
                  _add_edge(
                      edges,
                      target=claim,
                      kind=SupportKind.NAMED_PROPERTY,
                      source=_span(file, start, end),
                      raw=property_match.group(0),
                      named_property=property_match.group(1).lower(),
                  )

              since = _SINCE_RE.match(raw)
          ''',
              '''    for property_match in _NAMED_PROPERTY_RE.finditer(raw):
                  start = claim.source.start_offset + property_match.start()
                  end = claim.source.start_offset + property_match.end()
                  _add_edge(
                      edges,
                      target=claim,
                      kind=SupportKind.NAMED_PROPERTY,
                      source=_span(file, start, end),
                      raw=property_match.group(0),
                      named_property=property_match.group(1).lower(),
                  )

              # Real mathematical prose frequently names a support principle without a
              # theorem reference (for example, "using stability under ...").  Preserve
              # the asserted support phrase generically rather than growing a vocabulary
              # of property names.  The phrase is deliberately UNRESOLVED: extraction of
              # a support assertion is not evidence that its premises hold or that the
              # asserted mathematical transformation is valid.
              asserted = _ASSERTED_SUPPORT_RE.match(raw)
              has_structural_support = any(
                  edge.target_claim_identifier == claim.identifier
                  and edge.kind
                  in {
                      SupportKind.RESULT_REFERENCE,
                      SupportKind.EQUATION_REFERENCE,
                      SupportKind.DEFINITION,
                      SupportKind.NAMED_PROPERTY,
                  }
                  for edge in edges
              )
              if asserted is not None and not has_structural_support:
                  reason = asserted.group(1).strip()
                  reason_start = raw.find(asserted.group(1))
                  absolute_start = claim.source.start_offset + reason_start
                  reason_source = _span(
                      file,
                      absolute_start,
                      absolute_start + len(asserted.group(1)),
                  )
                  _add_edge(
                      edges,
                      target=claim,
                      kind=SupportKind.NAMED_PROPERTY,
                      source=reason_source,
                      raw=reason,
                      named_property=reason,
                      confidence=None,
                      status=InferenceStatus.UNRESOLVED,
                      evidence=[
                          StructuralEvidence(
                              reason=(
                                  "source explicitly presents this phrase as mathematical "
                                  "support; its identity, premises, and validity remain unresolved"
                              ),
                              source=reason_source,
                              target=claim.source,
                              context=claim.raw,
                          )
                      ],
                  )

              since = _SINCE_RE.match(raw)
          ''',
          )

          replace_once(
              "src/thorn/canonical_proof_ir.py",
              '''    used_dependency_labels = {
                  edge.target_label
                  for edge in included_support
                  if edge.kind == SupportKind.RESULT_REFERENCE and edge.target_label is not None
              }
              dependencies = [
                  dependency
                  for dependency in item.dependencies
                  if dependency.label in used_dependency_labels
              ]
          ''',
              '''    # SemanticReviewItem has already bounded direct dependencies for this
              # review target.  Preserve that dependency-driven closure here, including
              # assumptions/results referenced by the theorem statement itself.  Filtering
              # again by proof-body support edges made load-bearing statement assumptions
              # disappear and, worse, removed their source-rescue addresses.
              dependencies = sorted(
                  item.dependencies,
                  key=lambda dependency: (
                      dependency.source.file,
                      dependency.source.start_line,
                      dependency.source.end_line,
                      dependency.identifier,
                  ),
              )
          ''',
          )

          replace_once(
              "src/thorn/eval_review.py",
              '''def _result_symbol_context(
              project: ExtractedProject,
              result_identifier: str,
          ) -> tuple[
              list[Constraint],
              list[Constraint],
              list[Symbol],
              list[Definition],
              list[SymbolIntroductionCandidate],
          ]:
              table = project.symbol_table
              symbols = sorted(
                  (symbol for symbol in table.symbols if symbol.result_identifier == result_identifier),
                  key=_symbol_key,
              )
              symbol_ids = {symbol.identifier for symbol in symbols}
          ''',
              '''def _result_symbol_context(
              project: ExtractedProject,
              result_identifier: str,
              claims: list[Claim],
          ) -> tuple[
              list[Constraint],
              list[Constraint],
              list[Symbol],
              list[Definition],
              list[SymbolIntroductionCandidate],
          ]:
              table = project.symbol_table
              result = _result_node(project, result_identifier)

              def is_target_use(source: SourceSpan) -> bool:
                  if (
                      source.file == result.source.file
                      and result.source.start_line <= source.start_line <= result.source.end_line
                  ):
                      return True
                  return any(
                      source.file == claim.source.file
                      and claim.source.start_offset <= source.start_offset
                      and source.end_offset <= claim.source.end_offset
                      for claim in claims
                  )

              # Keep result-owned symbols, then close selectively over actually resolved
              # symbol uses in the target statement/proof.  This admits an outer/global
              # definition only when the target really uses that symbol; it is not a
              # whole-paper symbol-table dump.
              symbol_ids = {
                  symbol.identifier
                  for symbol in table.symbols
                  if symbol.result_identifier == result_identifier
              }
              symbol_ids.update(
                  use.resolved_symbol_identifier
                  for use in table.uses
                  if use.resolved_symbol_identifier is not None and is_target_use(use.source)
              )
              symbols = sorted(
                  (symbol for symbol in table.symbols if symbol.identifier in symbol_ids),
                  key=_symbol_key,
              )
          ''',
          )

          replace_once(
              "src/thorn/eval_review.py",
              '''    hypotheses, local_constraints, symbols, definitions, candidates = _result_symbol_context(
                  project,
                  result_identifier,
              )
          ''',
              '''    hypotheses, local_constraints, symbols, definitions, candidates = _result_symbol_context(
                  project,
                  result_identifier,
                  claims,
              )
          ''',
          )

          Path("tests/test_proof_ir_context_fidelity.py").write_text(r'''from __future__ import annotations

from pathlib import Path

from thorn.evidence import InferenceStatus
from thorn.eval_review import build_result_review_context
from thorn.latex import extract_project
from thorn.llm_proof_language import (
    parse_source_rescue_request,
    project_llm_proof_language,
    render_source_rescue,
)
from thorn.proof_obligations import ObligationStatus
from thorn.semantic_review_render import build_semantic_review_request
from thorn.semantic_transformations import (
    SemanticTransformationKind,
    build_semantic_transformation_ir,
)
from thorn.support import SupportKind


def _build(path: Path, target: str):
    project = extract_project(path)
    unit = project.unit(target)
    context = build_result_review_context(project, target)
    request = build_semantic_review_request(context.items[0])
    semantic = build_semantic_transformation_ir(
        unit,
        request,
        symbol_table=project.symbol_table,
        dependency_graph=project.dependency_graph,
    )
    return project, semantic, project_llm_proof_language(semantic)


def _write_definition_case(path: Path, definition: str) -> None:
    path.write_text(
        rf"""\documentclass{{article}}
\usepackage{{amsthm}}
\newtheorem{{assumption}}{{Assumption}}
\newtheorem{{theorem}}{{Theorem}}
\begin{{document}}
\begin{{assumption}}\label{{ass:scale}}
Let $S={definition}$.
\end{{assumption}}
\begin{{theorem}}\label{{thm:main}}
Under Assumption~\ref{{ass:scale}}, $Q(S)$.
\end{{theorem}}
\begin{{proof}}
\[
Q(S)
\]
\end{{proof}}
\end{{document}}
""",
        encoding="utf-8",
    )


def test_statement_dependency_survives_and_is_source_rescuable(tmp_path: Path) -> None:
    good = tmp_path / "definition-good.tex"
    bad = tmp_path / "definition-bad.tex"
    _write_definition_case(good, r"f(\tau^2)")
    _write_definition_case(bad, r"f(\tau)")

    _good_project, _good_ir, good_doc = _build(good, "thm:main")
    _bad_project, _bad_ir, bad_doc = _build(bad, "thm:main")

    good_handle = next(
        source
        for source in good_doc.sources
        if source.referenced_result_identifier == "ass:scale"
    )
    bad_handle = next(
        source
        for source in bad_doc.sources
        if source.referenced_result_identifier == "ass:scale"
    )
    assert r"\tau^2" in good_handle.text
    assert r"\tau^2" not in bad_handle.text
    assert good_doc.render_initial() != bad_doc.render_initial()

    rescue = render_source_rescue(
        good_doc,
        parse_source_rescue_request(good_doc, f"NEED_SOURCE {good_handle.address}"),
    )
    assert r"\tau^2" in rescue.text


def _write_precondition_case(path: Path, available: str) -> None:
    path.write_text(
        rf"""\documentclass{{article}}
\usepackage{{amsthm}}
\newtheorem{{lemma}}{{Lemma}}
\newtheorem{{theorem}}{{Theorem}}
\begin{{document}}
\begin{{lemma}}\label{{lem:transfer}}
If $H_B$, then $C$.
\end{{lemma}}
\begin{{proof}}
\[
H_B \Rightarrow C
\]
\end{{proof}}
\begin{{theorem}}\label{{thm:main}}
$C$.
\end{{theorem}}
\begin{{proof}}
We have ${available}$.
By Lemma~\ref{{lem:transfer}}, $C$.
\end{{proof}}
\end{{document}}
""",
        encoding="utf-8",
    )


def test_result_application_keeps_unmet_precondition_distinct_from_control(
    tmp_path: Path,
) -> None:
    bad = tmp_path / "precondition-bad.tex"
    good = tmp_path / "precondition-good.tex"
    _write_precondition_case(bad, "H_A")
    _write_precondition_case(good, "H_B")

    _bad_project, bad_ir, bad_doc = _build(bad, "thm:main")
    _good_project, good_ir, good_doc = _build(good, "thm:main")

    bad_app = next(
        item
        for item in bad_ir.transformations
        if item.kind == SemanticTransformationKind.RESULT_APPLICATION
    )
    good_app = next(
        item
        for item in good_ir.transformations
        if item.kind == SemanticTransformationKind.RESULT_APPLICATION
    )
    bad_obligation = bad_ir.obligation(bad_app.obligation_addresses[0])
    good_obligation = good_ir.obligation(good_app.obligation_addresses[0])

    assert bad_obligation.status == ObligationStatus.UNRESOLVED
    assert good_obligation.status == ObligationStatus.DISCHARGED
    assert bad_app.status == InferenceStatus.UNRESOLVED
    assert good_app.status == InferenceStatus.CONFIDENT
    assert "NEED " in bad_doc.render_initial()
    assert "NEED " not in good_doc.render_initial()


def test_generic_asserted_support_is_preserved_without_confidence_promotion(
    tmp_path: Path,
) -> None:
    tex = tmp_path / "asserted-property.tex"
    tex.write_text(
        r"""\documentclass{article}
\usepackage{amsthm}
\newtheorem{theorem}{Theorem}
\begin{document}
\begin{theorem}\label{thm:main}
$B$.
\end{theorem}
\begin{proof}
We have $A$.
Using the asserted implication from $A$ to smoothness, $B$.
\end{proof}
\end{document}
""",
        encoding="utf-8",
    )

    project, semantic, document = _build(tex, "thm:main")
    claims = project.proof_support_graph.claims_for_result("thm:main")
    relation = next(
        edge
        for edge in project.proof_support_graph.incoming_edges(claims[-1].identifier)
        if edge.kind == SupportKind.NAMED_PROPERTY
    )
    assert relation.status == InferenceStatus.UNRESOLVED
    assert relation.confidence is None
    assert "asserted implication" in relation.named_property

    transformation = next(
        item
        for item in semantic.transformations
        if item.kind == SemanticTransformationKind.NAMED_PROPERTY_APPLICATION
    )
    assert transformation.status == InferenceStatus.UNRESOLVED
    assert transformation.opaque_source_addresses
    assert "asserted implication" in document.render_initial()

    address = transformation.opaque_source_addresses[0]
    rescue = render_source_rescue(
        document,
        parse_source_rescue_request(document, f"NEED_SOURCE {address}"),
    )
    assert "asserted implication" in rescue.text
''', encoding="utf-8")
          PY
      - name: Install test environment
        run: python -m pip install -e '.[dev]'
      - name: Run issue 75 regressions
        run: pytest -q tests/test_proof_ir_context_fidelity.py tests/test_support.py tests/test_canonical_proof_ir.py tests/test_semantic_transformations.py tests/test_llm_proof_language.py
      - name: Run full keyless suite
        run: pytest -q
      - name: Validate corpus and analysis
        run: |
          thorn-eval eval/cases --validate-only
          thorn-eval eval/cases --analyze
          thorn analyze examples/demo.tex --structural-only
          thorn ir examples/demo.tex --structural-only --format json > /tmp/thorn-ir.json
      - name: Static checks
        run: |
          ruff check .
          mypy src
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue75-implement.yml
          git add src/thorn/support_extract.py src/thorn/canonical_proof_ir.py src/thorn/eval_review.py tests/test_proof_ir_context_fidelity.py
          git commit -m "Preserve load-bearing Proof IR context"
          git push origin HEAD:agent/issue-75-proof-ir-context-fidelity
