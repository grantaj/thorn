name: Issue 198 semantic projection spike

on:
  push:
    branches:
      - issue-198-semantic-projection-spike
  pull_request:
    branches:
      - issue-198-production-qualification
    paths:
      - ".github/workflows/issue-198-projection-spike.yml"
      - "scripts/apply_issue_198_projection_spike.py"
      - "scripts/evaluate_issue_198_nlp_statement_sources.py"

permissions:
  contents: read

jobs:
  projection-spike:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen Thorn runtime and local English model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/provider-runtime.txt -e '.[dev]'
          python -m pip install \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Check frozen qualification contract before spike
        run: pytest -q tests/test_issue_198_qualification.py
      - name: Apply speculative projection mutation
        run: python scripts/apply_issue_198_projection_spike.py
      - name: Evaluate dictionary-free NLP statement sources
        run: |
          python scripts/evaluate_issue_198_nlp_statement_sources.py \
            --output /tmp/issue-198-nlp-statement-source-spike.json
      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-198-nlp-statement-source-spike-${{ github.sha }}
          path: /tmp/issue-198-nlp-statement-source-spike.json
          if-no-files-found: error
