name: Issue 198 semantic projection spike

on:
  push:
    branches:
      - issue-198-semantic-projection-spike

permissions:
  contents: read

jobs:
  projection-spike:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen Thorn runtime and local English model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/provider-runtime.txt -e '.[dev]'
          python -m pip install \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Apply speculative projection mutation
        run: python scripts/apply_issue_198_projection_spike.py
      - name: Run deterministic regression suite
        run: pytest -q
      - name: Build frozen issue 198 preflight against mutated working tree
        run: |
          python scripts/prepare_issue_198_qualification.py \
            --output /tmp/issue-198-projection-spike.json
      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-198-projection-spike-${{ github.sha }}
          path: /tmp/issue-198-projection-spike.json
          if-no-files-found: warn
