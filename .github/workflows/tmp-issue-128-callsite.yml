name: TEMP issue 128 callsite patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-128-bounded-rescue-expansion' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-128-bounded-rescue-expansion
      - name: Add bounded-expansion argument
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/thorn/proof_language_review.py")
          text = path.read_text(encoding="utf-8")
          needle = (
              "        advertised=initial_turn.allowed_source_addresses,\n"
              "    )\n"
              "    try:\n"
          )
          replacement = (
              "        advertised=initial_turn.allowed_source_addresses,\n"
              "        max_addresses=initial_turn.max_source_addresses,\n"
              "    )\n"
              "    try:\n"
          )
          if replacement in text:
              raise SystemExit(0)
          if needle not in text:
              raise SystemExit("issue 128 rescue call site not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
      - name: Commit call-site edit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/proof_language_review.py
          git commit -m "Pass rescue bound into prerequisite expansion"
          git push origin HEAD:agent/issue-128-bounded-rescue-expansion
