name: TEMP observe issue 134 authorized run

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  observe:
    if: github.head_ref == 'agent/issue-134-live-authorized'
    runs-on: ubuntu-latest
    env:
      TARGET_RUN_SHA: 28feb52af0095995c00610ef8e6ceafdfdb5ab03
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Observe the single authorized run
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_sha = os.environ['TARGET_RUN_SHA']
          api = 'https://api.github.com'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'thorn-issue-134-observer',
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          params = urllib.parse.urlencode({
              'branch': 'agent/issue-134-live-authorized',
              'event': 'push',
              'per_page': 50,
          })
          runs_url = f'{api}/repos/{repo}/actions/workflows/issue-134-pre125.yml/runs?{params}'
          run = None
          for _ in range(80):
              payload = get_json(runs_url)
              matches = [item for item in payload.get('workflow_runs', []) if item.get('head_sha') == target_sha]
              if matches:
                  run = matches[0]
                  print('AUTHORIZED_RUN')
                  print(json.dumps({
                      'id': run.get('id'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'event': run.get('event'),
                      'head_branch': run.get('head_branch'),
                      'head_sha': run.get('head_sha'),
                      'created_at': run.get('created_at'),
                      'updated_at': run.get('updated_at'),
                      'html_url': run.get('html_url'),
                  }, indent=2, sort_keys=True))
                  if run.get('status') == 'completed':
                      break
              time.sleep(15)
          if run is None:
              raise SystemExit(f'authorized workflow run for {target_sha} was not found')
          if run.get('status') != 'completed':
              raise SystemExit(f'authorized workflow run did not complete: {run.get("status")}')

          run_id = int(run['id'])
          jobs = get_json(f'{api}/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')
          print('AUTHORIZED_JOBS')
          print(json.dumps([
              {
                  'id': job.get('id'),
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'started_at': job.get('started_at'),
                  'completed_at': job.get('completed_at'),
              }
              for job in jobs.get('jobs', [])
          ], indent=2, sort_keys=True))

          artifacts = get_json(f'{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          print('AUTHORIZED_ARTIFACTS')
          print(json.dumps([
              {
                  'id': artifact.get('id'),
                  'name': artifact.get('name'),
                  'size_in_bytes': artifact.get('size_in_bytes'),
                  'expired': artifact.get('expired'),
              }
              for artifact in artifacts.get('artifacts', [])
          ], indent=2, sort_keys=True))
          PY
