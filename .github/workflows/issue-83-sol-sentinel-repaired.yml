name: Issue 83 Sol sentinel repaired

on:
  push:
    branches:
      - agent/issue-83-sol-sentinel-repaired
    paths:
      - .github/workflows/issue-83-sol-sentinel-repaired.yml

jobs:
  sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SENTINEL_MODEL: gpt-5.6-sol
      SENTINEL_MANIFEST: /tmp/issue83-sol-sentinel-repaired.json
      ARTIFACT_DIR: /tmp/issue83-sol-sentinel-repaired
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Thorn and local English model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m spacy download en_core_web_sm

      - name: Build exact six-case sentinel manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = {
              "clean_nonzero_cancellation.json",
              "missing_nonzero_hypothesis.json",
              "sneaky_prose_downstream.json",
              "clean_quotient_map.json",
              "quotient_map_not_well_defined.json",
              "quantifier_swap.json",
          }
          source = Path("eval/proof-review-challenge.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          matches = [
              case for case in manifest["cases"]
              if Path(case["metadata"]).name in selected
          ]
          if len(matches) != 6:
              raise SystemExit(f"expected exactly six sentinel cases, found {len(matches)}")
          if {Path(case["metadata"]).name for case in matches} != selected:
              raise SystemExit("sentinel case selection drifted")
          manifest["description"] = (
              "Repaired six-case Sol checkpoint after issue #83 rescue-closure sentinel; "
              "not the complete registered experiment."
          )
          manifest["cases"] = matches
          destination = Path(os.environ["SENTINEL_MANIFEST"])
          destination.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("\n".join(case["metadata"] for case in matches))
          PY

      - name: Verify live-call safety and repaired boundary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured"
            exit 2
          fi
          python - <<'PY'
          from thorn.providers.request_envelope import PROOF_REVIEW_MAX_OUTPUT_TOKENS
          from thorn.proof_language_review import build_proof_review_turn

          assert PROOF_REVIEW_MAX_OUTPUT_TOKENS == 4096
          assert build_proof_review_turn.__module__ == "thorn.proof_language_review"
          print("proof_review_max_output_tokens=4096")
          print("model=gpt-5.6-sol")
          print("cases=6")
          print("initial_arm_runs=18")
          print("max_logical_requests=24")
          PY

      - name: Build keyless repaired sentinel inventory
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$ARTIFACT_DIR"
          cp "$SENTINEL_MANIFEST" "$ARTIFACT_DIR/sentinel-manifest.json"
          python scripts/prepare_proof_review_experiment.py \
            --manifest "$SENTINEL_MANIFEST" \
            --model "$SENTINEL_MODEL" \
            --output "$ARTIFACT_DIR/inventory.json"

      - name: Run recorded repaired Sol A/B/C sentinel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$ARTIFACT_DIR/recordings"
          python scripts/run_proof_review_experiment.py \
            --manifest "$SENTINEL_MANIFEST" \
            --model "$SENTINEL_MODEL" \
            --live \
            --record-dir "$ARTIFACT_DIR/recordings" \
            --output "$ARTIFACT_DIR/live-results.json"

      - name: Replay repaired sentinel keylessly
        env:
          OPENAI_API_KEY: ""
        run: |
          python scripts/run_proof_review_experiment.py \
            --manifest "$SENTINEL_MANIFEST" \
            --model "$SENTINEL_MODEL" \
            --replay-dir "$ARTIFACT_DIR/recordings" \
            --output "$ARTIFACT_DIR/replay-results.json"

      - name: Verify exact structured replay and summarize usage
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_DIR"])
          live = json.loads((root / "live-results.json").read_text(encoding="utf-8"))
          replay = json.loads((root / "replay-results.json").read_text(encoding="utf-8"))

          def comparable(result):
              return [
                  {
                      "metadata": item["metadata"],
                      "arm": item["arm"],
                      "protocol_error": item["protocol_error"],
                      "findings": item["findings"],
                      "source_rescued": item["source_rescued"],
                      "source_addresses_requested": item["source_addresses_requested"],
                      "request_fingerprints": item["request_fingerprints"],
                      "initial_packet_fingerprint": item["initial_packet_fingerprint"],
                  }
                  for item in result["results"]
              ]

          if comparable(live) != comparable(replay):
              raise SystemExit("keyless replay did not reproduce live structured outputs")

          summary = {
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "model": live["model"],
              "cases": live["cases"],
              "arm_runs": live["arm_runs"],
              "provider_requests": live["provider_requests"],
              "live_requests": live["live_requests"],
              "input_tokens": live["input_tokens"],
              "output_tokens": live["output_tokens"],
              "total_tokens": live["total_tokens"],
              "source_rescue_runs": live["source_rescue_runs"],
              "output_token_cap_per_request": 4096,
              "replay_exact": True,
              "arms": {
                  arm: {
                      "requests": metrics["requests"],
                      "input_tokens": metrics["input_tokens"],
                      "output_tokens": metrics["output_tokens"],
                      "total_tokens": metrics["total_tokens"],
                      "source_rescue_runs": metrics["source_rescue_runs"],
                  }
                  for arm, metrics in live["arm_metrics"].items()
              },
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve repaired Sol sentinel recordings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-83-sol-sentinel-repaired-${{ github.run_id }}
          path: /tmp/issue83-sol-sentinel-repaired
          if-no-files-found: error
          retention-days: 30
