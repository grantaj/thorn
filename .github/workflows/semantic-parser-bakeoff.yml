name: Semantic parser bake-off

on:
  workflow_dispatch:
  push:
    branches:
      - agent/issue-29-semantic-parser-bakeoff
    paths:
      - "research/semantic-parser-bakeoff/**"
      - "src/thorn/semantic_projection.py"
      - "tests/test_semantic_projection.py"
      - ".github/workflows/semantic-parser-bakeoff.yml"

permissions:
  contents: read

env:
  OPENAI_API_KEY: ""

jobs:
  dependency-parsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: [spacy, stanza]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python -m pip install --upgrade pip
          if [ "$CANDIDATE" = "spacy" ]; then
            python -m pip install "spacy==3.8.14"
            python -m spacy download en_core_web_sm
          else
            python -m pip install "stanza==1.14.0"
            python - <<'PY'
          import stanza
          stanza.download("en", processors="tokenize,pos,lemma,depparse", verbose=False)
          PY
          fi

      - name: Run dependency bake-off
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python research/semantic-parser-bakeoff/run_dependency_bakeoff.py \
            --candidate "$CANDIDATE" \
            --output "$CANDIDATE-report.json"

      - name: Print summary
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = os.environ["CANDIDATE"]
          report = json.loads(Path(f"{candidate}-report.json").read_text())
          print(json.dumps({
              "candidate": report["candidate"],
              "cases": report["cases"],
              "elapsed_seconds": report["elapsed_seconds"],
              "missing_placeholder_tokens": report["missing_placeholder_tokens"],
              "metrics": report["metrics"],
          }, indent=2))
          PY
