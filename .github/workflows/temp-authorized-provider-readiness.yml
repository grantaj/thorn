name: Temporary authorized provider readiness canary

on:
  push:
    branches:
      - agent/provider-readiness-authorized-20260819

permissions:
  contents: read

jobs:
  readiness:
    if: ${{ github.event.head_commit.message == 'Run authorized provider readiness canary' }}
    runs-on: ubuntu-latest
    env:
      THORN_READINESS_MODEL: gpt-5.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .

      - name: Keyless preflight
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/provider-readiness"
          python scripts/provider_readiness_canary.py \
            --preflight \
            --model "$THORN_READINESS_MODEL" \
            --output "$RUNNER_TEMP/provider-readiness/preflight.json"

      - name: Authorized synthetic initial and rescue canary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/provider_readiness_canary.py \
            --live \
            --confirm-paid-readiness-canary \
            --model "$THORN_READINESS_MODEL" \
            --output "$RUNNER_TEMP/provider-readiness/live.json"

      - name: Keyless replay verification
        env:
          OPENAI_API_KEY: ""
        run: |
          python scripts/provider_readiness_canary.py \
            --replay "$RUNNER_TEMP/provider-readiness/live.json" \
            --output "$RUNNER_TEMP/provider-readiness/replay.json"

      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-readiness-authorized-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-readiness
          if-no-files-found: error
