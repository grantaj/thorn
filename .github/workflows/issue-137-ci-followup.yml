name: TEMP issue 137 full-CI follow-up

on:
  push:
    branches:
      - agent/issue-137-schema-transport

permissions:
  contents: write

jobs:
  followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-137-schema-transport
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python .github/issue137_ci_followup.py
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: mypy src
      - name: Commit tested compatibility fixes and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-137-ci-followup.yml .github/issue137_ci_followup.py
          git add scripts/run_issue_101_live.py scripts/issue_101_robustness.py tests/test_issue_101_robustness.py tests/test_proof_review_output_cap.py
          git commit -m "Keep frozen robustness tooling fail-closed after schema repair"
          git push origin HEAD:agent/issue-137-schema-transport
