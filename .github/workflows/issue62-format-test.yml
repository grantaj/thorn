name: Issue 62 test format

on:
  push:
    branches:
      - agent/issue-62-symbol-scope-resolution

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-62-symbol-scope-resolution
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Format issue 62 test file
        run: |
          ruff format tests/test_symbol_resolution_ir.py
          ruff check tests/test_symbol_resolution_ir.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_symbol_resolution_ir.py
          git commit -m "Format issue 62 tests"
          git push origin HEAD:agent/issue-62-symbol-scope-resolution
