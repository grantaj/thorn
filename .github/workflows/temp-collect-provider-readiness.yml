name: Temporary collect authorized readiness evidence

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: ${{ github.head_ref == 'agent/provider-readiness-authorized-20260819' }}
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 749718e3697d1a5acbe148d22a73a73e52772cb0
      TARGET_WORKFLOW_NAME: Temporary authorized provider readiness canary
    steps:
      - name: Report completed canary run and artifact identifiers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_name = os.environ["TARGET_WORKFLOW_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          payload = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={target_sha}&per_page=100"
          )
          matches = [
              item for item in payload.get("workflow_runs", [])
              if item.get("name") == target_name and item.get("head_sha") == target_sha
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one authorized canary run, found {len(matches)}")
          run = matches[0]
          artifacts = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100"
          ).get("artifacts", [])
          artifact_matches = [
              item for item in artifacts
              if item.get("name", "").startswith("provider-readiness-authorized-")
          ]
          if len(artifact_matches) != 1:
              raise SystemExit(f"expected exactly one readiness artifact, found {len(artifact_matches)}")
          artifact = artifact_matches[0]
          print("THORN_READINESS_OBSERVATION=" + json.dumps({
              "run_id": run["id"],
              "run_number": run.get("run_number"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "event": run.get("event"),
              "head_sha": run.get("head_sha"),
              "created_at": run.get("created_at"),
              "updated_at": run.get("updated_at"),
              "artifact_id": artifact["id"],
              "artifact_name": artifact["name"],
              "artifact_size_in_bytes": artifact.get("size_in_bytes"),
          }, sort_keys=True))
          PY
