name: Temporary collect authorized readiness evidence

on:
  push:
    branches:
      - agent/provider-readiness-authorized-20260819

permissions:
  actions: read
  contents: write

jobs:
  collect:
    if: ${{ github.event.head_commit.message == 'Collect authorized readiness evidence' }}
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 749718e3697d1a5acbe148d22a73a73e52772cb0
      TARGET_WORKFLOW_NAME: Temporary authorized provider readiness canary
      EVIDENCE_DIR: eval/provider_readiness/authorized_20260819
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-readiness-authorized-20260819
      - name: Locate completed canary and extract its artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_name = os.environ["TARGET_WORKFLOW_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          evidence_dir.mkdir(parents=True, exist_ok=True)

          def get_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          run = None
          for _ in range(120):
              payload = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs?head_sha={target_sha}&per_page=100"
              )
              matches = [
                  item for item in payload.get("workflow_runs", [])
                  if item.get("name") == target_name and item.get("head_sha") == target_sha
              ]
              if matches:
                  run = max(matches, key=lambda item: item["id"])
                  if run.get("status") == "completed":
                      break
              time.sleep(5)
          if run is None or run.get("status") != "completed":
              raise SystemExit("authorized readiness canary did not reach completed state")

          artifacts = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100"
          ).get("artifacts", [])
          matches = [
              item for item in artifacts
              if item.get("name", "").startswith("provider-readiness-authorized-")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one readiness artifact, found {len(matches)}")
          artifact = matches[0]

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              archive = response.read()
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              for member in zf.infolist():
                  if member.is_dir():
                      continue
                  destination = evidence_dir / Path(member.filename).name
                  destination.write_bytes(zf.read(member))

          metadata = {
              "run_id": run["id"],
              "run_number": run.get("run_number"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "event": run.get("event"),
              "head_sha": run.get("head_sha"),
              "created_at": run.get("created_at"),
              "updated_at": run.get("updated_at"),
              "artifact_id": artifact["id"],
              "artifact_name": artifact["name"],
              "artifact_size_in_bytes": artifact.get("size_in_bytes"),
              "scientific_authorization": False,
              "readiness_only": True,
          }
          (evidence_dir / "RUN_METADATA.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY
      - name: Commit collected evidence to isolated branch
        run: |
          git config user.name "thorn-readiness-observer"
          git config user.email "thorn-readiness-observer@users.noreply.github.com"
          git add "$EVIDENCE_DIR"
          git commit -m "Preserve authorized readiness evidence"
          git push origin HEAD:agent/provider-readiness-authorized-20260819
