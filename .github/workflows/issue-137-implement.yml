name: TEMP implement issue 137

on:
  push:
    branches:
      - agent/issue-137-schema-transport

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-137-schema-transport
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply issue 137 repair
        run: |
          python .github/issue137_apply.py
          python .github/issue137_followup.py
      - run: python -m pip install -e '.[dev]'
      - name: Run issue 137 and prior live-defect regressions
        run: >-
          pytest -q
          tests/test_issue_137_schema_transport.py
          tests/test_proof_language_review.py
          tests/test_rejected_replay.py
          tests/test_issue_128_bounded_rescue_expansion.py
          tests/test_issue_132_rescue_finding_accounting.py
      - run: ruff check src/thorn/providers/base.py src/thorn/providers/openai.py src/thorn/providers/replay.py src/thorn/providers/request_envelope.py tests/test_issue_137_schema_transport.py tests/test_proof_language_review.py tests/test_rejected_replay.py
      - run: mypy src
      - name: Commit tested repair and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-137-implement.yml .github/issue137_apply.py .github/issue137_followup.py
          git add src/thorn/providers/base.py src/thorn/providers/openai.py src/thorn/providers/replay.py src/thorn/providers/request_envelope.py tests/test_issue_137_schema_transport.py tests/test_proof_language_review.py tests/test_rejected_replay.py eval/robustness/issue_137/README.md
          git commit -m "Fix proof-review schema and failure evidence"
          git push origin HEAD:agent/issue-137-schema-transport
