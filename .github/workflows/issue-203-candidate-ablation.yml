name: Issue 203 candidate ablation evidence

on:
  push:
    branches:
      - issue-203-mature-substrate-ablation
      - issue-203-ablate-prose-semantic-context
  pull_request:
    paths:
      - ".github/workflows/issue-203-candidate-ablation.yml"
      - "eval/robustness/issue_203/**"
      - "scripts/measure_issue_203_candidate.py"
      - "src/thorn/candidate_review.py"
      - "src/thorn/context_retrieval.py"
      - "src/thorn/latex.py"
      - "src/thorn/linguistic_statements.py"
      - "src/thorn/frontends/tree_sitter.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Materialize unchanged issue 198 Phase 1 cases
        run: |
          git fetch origin issue-198-production-qualification
          mkdir -p eval/robustness/issue_198
          git show origin/issue-198-production-qualification:eval/robustness/issue_198/qualification_manifest.json \
            > /tmp/issue-198-frozen-manifest.json
          git show origin/issue-198-production-qualification:eval/robustness/issue_198/heldout_diagonal_regular_clean.tex \
            > eval/robustness/issue_198/heldout_diagonal_regular_clean.tex
      - name: Assert legacy prose interpretation is absent from production
        run: |
          test ! -e src/thorn/linguistic_declarations.py
          test ! -e src/thorn/project_semantic_context.py
          test ! -e scripts/measure_issue_203_prose_ablation.py
      - name: Install keyless runtime and local retrieval candidates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/provider-runtime.txt -e '.[dev]'
          python -m pip install sentence-transformers==5.7.0
          python -m pip install \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Verify production candidate on frozen evidence
        run: |
          python scripts/measure_issue_203_candidate.py \
            --manifest /tmp/issue-198-frozen-manifest.json \
            --manifest eval/robustness/issue_203/generalisation_manifest.json \
            --output /tmp/issue-203-candidate-evidence.json
      - name: Upload production candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-203-production-candidate-evidence-${{ github.sha }}
          path: |
            /tmp/issue-198-frozen-manifest.json
            /tmp/issue-203-candidate-evidence.json
            eval/robustness/issue_203/generalisation_manifest.json
          if-no-files-found: warn
