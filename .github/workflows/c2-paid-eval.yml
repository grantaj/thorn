name: C2 paid semantic comparison

on:
  push:
    branches:
      - agent/issue-20-c2-paid-eval
    paths:
      - .github/workflows/c2-paid-eval.yml

jobs:
  c2-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      THORN_EVAL_MODEL: gpt-5.6
      THORN_EVAL_MIN_CONFIDENCE: "0.65"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Thorn and local linguistic model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m spacy download en_core_web_sm
      - name: Confirm bounded targeted selection keylessly
        env:
          OPENAI_API_KEY: ""
        run: |
          set -o pipefail
          cases=(
            clean_nonzero_cancellation
            missing_nonzero_hypothesis
            clean_quotient_map
            quotient_map_not_well_defined
            rolle_gap
            bad_lemma_breaks_theorem
          )
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "model=$THORN_EVAL_MODEL"
            echo "min_confidence=$THORN_EVAL_MIN_CONFIDENCE"
            for case_name in "${cases[@]}"; do
              echo
              echo "=== PREFLIGHT case=$case_name ==="
              thorn-eval eval/cases \
                --targeted-preflight \
                --case-filter "$case_name"
            done
          } | tee c2-preflight.txt
      - name: Run bounded raw IR targeted comparison
        run: |
          set -o pipefail
          cases=(
            clean_nonzero_cancellation
            missing_nonzero_hypothesis
            clean_quotient_map
            quotient_map_not_well_defined
            rolle_gap
            bad_lemma_breaks_theorem
          )
          modes=(raw ir targeted)
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "model=$THORN_EVAL_MODEL"
            echo "min_confidence=$THORN_EVAL_MIN_CONFIDENCE"
            echo "scope=6 selected public C2 fixtures x raw|ir|targeted"
            for mode in "${modes[@]}"; do
              for case_name in "${cases[@]}"; do
                echo
                echo "=== PAID mode=$mode case=$case_name ==="
                set +e
                thorn-eval eval/cases \
                  --model "$THORN_EVAL_MODEL" \
                  --min-confidence "$THORN_EVAL_MIN_CONFIDENCE" \
                  --case-filter "$case_name" \
                  --review-context "$mode" \
                  --no-defender
                status=$?
                set -e
                echo "thorn_eval_exit_status=$status"
              done
            done
          } | tee c2-live-eval.txt
      - name: Preserve C2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-paid-eval-${{ github.run_id }}
          path: |
            c2-preflight.txt
            c2-live-eval.txt
          if-no-files-found: warn
