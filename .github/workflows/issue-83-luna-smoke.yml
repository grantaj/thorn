name: Issue 83 Luna smoke

on:
  push:
    branches:
      - agent/issue-83-luna-smoke
    paths:
      - .github/workflows/issue-83-luna-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SMOKE_MODEL: gpt-5.6-luna
      SMOKE_CASE: sneaky_prose_downstream.json
      SMOKE_MANIFEST: /tmp/issue83-luna-smoke.json
      ARTIFACT_DIR: /tmp/issue83-luna-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Thorn and local English model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m spacy download en_core_web_sm

      - name: Build one-case smoke manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("eval/proof-review-challenge.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          case_name = os.environ["SMOKE_CASE"]
          matches = [
              case for case in manifest["cases"]
              if case["metadata"].endswith(case_name)
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one smoke case, found {len(matches)}")
          manifest["description"] = (
              "Temporary one-case Luna plumbing subset of the frozen issue #83 challenge; "
              "not a scientific evaluation result."
          )
          manifest["cases"] = matches
          destination = Path(os.environ["SMOKE_MANIFEST"])
          destination.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(matches[0]["metadata"])
          PY

      - name: Verify live-call safety configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured"
            exit 2
          fi
          python - <<'PY'
          from thorn.providers.request_envelope import PROOF_REVIEW_MAX_OUTPUT_TOKENS
          from thorn.providers import openai as provider_module

          assert PROOF_REVIEW_MAX_OUTPUT_TOKENS == 4096
          assert provider_module.OpenAIProvider.__init__.__code__ is not None
          print("proof_review_max_output_tokens=4096")
          print("model=gpt-5.6-luna")
          PY

      - name: Build keyless Luna smoke inventory
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$ARTIFACT_DIR"
          cp "$SMOKE_MANIFEST" "$ARTIFACT_DIR/smoke-manifest.json"
          python scripts/prepare_proof_review_experiment.py \
            --manifest "$SMOKE_MANIFEST" \
            --model "$SMOKE_MODEL" \
            --output "$ARTIFACT_DIR/inventory.json"

      - name: Run recorded Luna A/B/C smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$ARTIFACT_DIR/recordings"
          python scripts/run_proof_review_experiment.py \
            --manifest "$SMOKE_MANIFEST" \
            --model "$SMOKE_MODEL" \
            --live \
            --record-dir "$ARTIFACT_DIR/recordings" \
            --output "$ARTIFACT_DIR/live-results.json"

      - name: Replay smoke test keylessly
        env:
          OPENAI_API_KEY: ""
        run: |
          python scripts/run_proof_review_experiment.py \
            --manifest "$SMOKE_MANIFEST" \
            --model "$SMOKE_MODEL" \
            --replay-dir "$ARTIFACT_DIR/recordings" \
            --output "$ARTIFACT_DIR/replay-results.json"

      - name: Verify exact structured replay and summarize usage
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_DIR"])
          live = json.loads((root / "live-results.json").read_text(encoding="utf-8"))
          replay = json.loads((root / "replay-results.json").read_text(encoding="utf-8"))

          def comparable(result):
              return [
                  {
                      "metadata": item["metadata"],
                      "arm": item["arm"],
                      "protocol_error": item["protocol_error"],
                      "findings": item["findings"],
                      "source_rescued": item["source_rescued"],
                      "source_addresses_requested": item["source_addresses_requested"],
                      "request_fingerprints": item["request_fingerprints"],
                      "initial_packet_fingerprint": item["initial_packet_fingerprint"],
                  }
                  for item in result["results"]
              ]

          if comparable(live) != comparable(replay):
              raise SystemExit("keyless replay did not reproduce live structured outputs")

          summary = {
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "model": live["model"],
              "case": os.environ["SMOKE_CASE"],
              "provider_requests": live["provider_requests"],
              "live_requests": live["live_requests"],
              "input_tokens": live["input_tokens"],
              "output_tokens": live["output_tokens"],
              "total_tokens": live["total_tokens"],
              "source_rescue_runs": live["source_rescue_runs"],
              "output_token_cap_per_request": 4096,
              "replay_exact": True,
              "arms": {
                  arm: {
                      "requests": metrics["requests"],
                      "input_tokens": metrics["input_tokens"],
                      "output_tokens": metrics["output_tokens"],
                      "total_tokens": metrics["total_tokens"],
                      "source_rescue_runs": metrics["source_rescue_runs"],
                  }
                  for arm, metrics in live["arm_metrics"].items()
              },
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve Luna smoke recordings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-83-luna-smoke-${{ github.run_id }}
          path: /tmp/issue83-luna-smoke
          if-no-files-found: error
          retention-days: 30
