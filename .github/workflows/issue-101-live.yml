name: Issue 101 frozen robustness run

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Run the authorized paid batch after keyless preflight
        required: true
        default: false
        type: boolean

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .
      - name: Verify frozen request contracts and budgets
        run: |
          python scripts/run_issue_101_live.py \
            --preflight \
            --output "$RUNNER_TEMP/issue-101-preflight.json"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-101-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-101-preflight.json
          if-no-files-found: error

  live:
    if: ${{ inputs.confirm_live }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .
      - name: Run frozen paid batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue-101/recordings" "$RUNNER_TEMP/issue-101/reports"
          python scripts/run_issue_101_live.py \
            --live \
            --record-dir "$RUNNER_TEMP/issue-101/recordings" \
            --report-dir "$RUNNER_TEMP/issue-101/reports" \
            --output "$RUNNER_TEMP/issue-101/live.json"
      - name: Verify exact keyless replay
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/issue-101/replay-reports"
          python scripts/run_issue_101_live.py \
            --replay-dir "$RUNNER_TEMP/issue-101/recordings" \
            --report-dir "$RUNNER_TEMP/issue-101/replay-reports" \
            --output "$RUNNER_TEMP/issue-101/replay.json"
      - name: Preserve live and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-101-live-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-101
          if-no-files-found: error
