name: Lean contract

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      THORN_REQUIRE_LEAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify pinned Lean
        run: lean --version
      - name: Run Lean handoff acceptance
        run: pytest -q tests/test_lean_export.py
