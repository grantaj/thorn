name: Lean contract

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      THORN_REQUIRE_LEAN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Elan
        run: |
          curl -fsSL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  /tmp/elan.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify pinned Lean
        run: lean --version
      - name: Run Lean handoff acceptance
        run: pytest -q tests/test_lean_export.py
      - name: Exercise public onboarding Lean seam
        run: |
          thorn lean examples/quickstart/clean/paper.tex --structural-only --result thm:main --output /tmp/thorn-quickstart.lean
          lean /tmp/thorn-quickstart.lean
