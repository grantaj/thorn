name: TEMP issue 132 repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-132-rescue-finding-accounting' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-132-rescue-finding-accounting
      - name: Apply finding-identity normalization repair
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/thorn/proof_language_review.py")
          text = source.read_text(encoding="utf-8")
          start = text.index("def _validate_rescue_accountability(")
          end = text.index("\n\ndef validate_proof_review_response(", start)
          replacement = '''def _finding_identity_compatible(
              canonical: CandidateFinding,
              local: CandidateFinding,
          ) -> bool:
              """Return whether two payloads may represent one protocol finding identity.

              ``thorn-proof-review/2`` uses the finding ID as the explicit consolidation
              signal. A disposition may summarize a finding more tersely than the final
              top-level version, so prose equality is not required. Category and severity
              are the stable structural semantics that must agree before one ID can be
              consolidated without fuzzy text matching.
              """

              return (
                  canonical.category == local.category
                  and canonical.severity == local.severity
              )


          def _validate_rescue_accountability(
              request: ProofReviewTurnRequest,
              response: ProofReviewModelResponse,
          ) -> None:
              if request.stage != "rescue":
                  if response.dispositions:
                      raise ProofReviewProtocolError(
                          "initial review responses cannot contain dispositions"
                      )
                  return

              expected = request.carried_review_item_ids()
              disposition_ids = tuple(item.item_id for item in response.dispositions)
              if len(set(disposition_ids)) != len(disposition_ids):
                  raise ProofReviewProtocolError(
                      "a carried review item was dispositioned more than once"
                  )

              unknown = [item_id for item_id in disposition_ids if item_id not in expected]
              if unknown:
                  raise ProofReviewProtocolError(
                      "final response disposition references unknown review item: "
                      + ", ".join(unknown)
                  )

              missing = [item_id for item_id in expected if item_id not in disposition_ids]
              if missing:
                  raise ProofReviewProtocolError(
                      "final response omitted carried review item: " + ", ".join(missing)
                  )

              reused = [finding.id for finding in response.findings if finding.id in expected]
              if reused:
                  raise ProofReviewProtocolError(
                      "new finding reuses a carried review identity: " + ", ".join(reused)
                  )

              top_by_id: dict[str, CandidateFinding] = {}
              duplicate_top_level: list[str] = []
              for finding in response.findings:
                  if finding.id in top_by_id:
                      if finding.id not in duplicate_top_level:
                          duplicate_top_level.append(finding.id)
                  else:
                      top_by_id[finding.id] = finding
              if duplicate_top_level:
                  raise ProofReviewProtocolError(
                      "final response reuses finding identity across rescue accounting: "
                      + ", ".join(duplicate_top_level)
                  )

              disposition_only: dict[str, CandidateFinding] = {}
              incompatible: list[str] = []
              ambiguous: list[str] = []
              for disposition in response.dispositions:
                  finding = disposition.finding
                  if finding is None:
                      continue
                  canonical = top_by_id.get(finding.id)
                  if canonical is not None:
                      if (
                          not _finding_identity_compatible(canonical, finding)
                          and finding.id not in incompatible
                      ):
                          incompatible.append(finding.id)
                      continue

                  previous = disposition_only.get(finding.id)
                  if previous is None:
                      disposition_only[finding.id] = finding
                  elif (
                      _canonical_finding_payload(previous)
                      != _canonical_finding_payload(finding)
                      and finding.id not in ambiguous
                  ):
                      ambiguous.append(finding.id)

              if incompatible:
                  raise ProofReviewProtocolError(
                      "incompatible finding identity across rescue accounting: "
                      + ", ".join(incompatible)
                  )
              if ambiguous:
                  raise ProofReviewProtocolError(
                      "ambiguous disposition-only finding identity: "
                      + ", ".join(ambiguous)
                  )


          def _normalize_rescue_finding_identities(
              request: ProofReviewTurnRequest,
              response: ProofReviewModelResponse,
          ) -> ProofReviewModelResponse:
              """Consolidate repeated rescue finding identities deterministically.

              A unique top-level finding is the canonical payload for its ID. Carried
              dispositions that use the same compatible ID are rewritten to that payload.
              Without a top-level canonical payload, repeated disposition-local uses have
              already been required to be byte-identical by accountability validation.
              Top-level copies represented by dispositions are then removed so downstream
              reporting sees one semantic finding identity rather than accounting duplicates.
              """

              if request.stage != "rescue":
                  return response

              top_by_id = {finding.id: finding for finding in response.findings}
              disposition_canonical: dict[str, CandidateFinding] = {}
              normalized_dispositions: list[ProofReviewDisposition] = []
              carried_ids: set[str] = set()

              for disposition in response.dispositions:
                  finding = disposition.finding
                  if finding is None:
                      normalized_dispositions.append(disposition)
                      continue

                  carried_ids.add(finding.id)
                  canonical = top_by_id.get(finding.id)
                  if canonical is None:
                      canonical = disposition_canonical.setdefault(finding.id, finding)
                  normalized_dispositions.append(
                      disposition.model_copy(update={"finding": canonical})
                  )

              findings = tuple(
                  finding for finding in response.findings if finding.id not in carried_ids
              )
              dispositions = tuple(normalized_dispositions)
              if findings == response.findings and dispositions == response.dispositions:
                  return response
              return response.model_copy(
                  update={"findings": findings, "dispositions": dispositions}
              )
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "normalized = _normalize_exact_duplicate_carried_findings(request, normalized)",
              "normalized = _normalize_rescue_finding_identities(request, normalized)",
              1,
          )

          report_start = text.index("def _attack_report_from_response(")
          report_end = text.index("\n\ndef review_proof_language(", report_start)
          report_replacement = '''def _attack_report_from_response(
              response: ProofReviewModelResponse,
          ) -> AttackReport:
              ordered = [
                  *(
                      disposition.finding
                      for disposition in response.dispositions
                      if disposition.finding is not None
                  ),
                  *response.findings,
              ]
              findings: list[CandidateFinding] = []
              seen_ids: set[str] = set()
              for finding in ordered:
                  if finding.id in seen_ids:
                      continue
                  seen_ids.add(finding.id)
                  findings.append(finding)
              return AttackReport(findings=findings)
          '''
          text = text[:report_start] + report_replacement + text[report_end:]
          source.write_text(text, encoding="utf-8")

          tests_path = Path("tests/test_proof_review_accounting.py")
          tests = tests_path.read_text(encoding="utf-8")

          old_name = "def test_rescue_rejects_conflicting_payload_for_carried_finding_identity() -> None:"
          next_name = "def test_rescue_normalization_preserves_new_finding_order() -> None:"
          if old_name in tests:
              a = tests.index(old_name)
              b = tests.index(next_name, a)
              block = '''def test_rescue_rejects_incompatible_payload_for_carried_finding_identity() -> None:
              _, rescue = _rescue_turn()
              carried = _finding("F1")
              incompatible = carried.model_copy(
                  update={"category": FindingCategory.INVALID_IMPLICATION}
              )
              response = ProofReviewModelResponse(
                  action="review",
                  findings=(incompatible,),
                  dispositions=(
                      ProofReviewDisposition(
                          item_id="RV1",
                          status="confirmed",
                          explanation="The carried concern is confirmed.",
                          finding=carried,
                      ),
                  ),
              )

              with pytest.raises(
                  ProofReviewProtocolError,
                  match="incompatible finding identity across rescue accounting: F1",
              ):
                  validate_proof_review_response(rescue, response)


          '''
              tests = tests[:a] + block + tests[b:]

          old_name = "def test_rescue_rejects_same_finding_identity_for_two_carried_items() -> None:"
          next_name = "def test_duplicate_rescue_finding_is_normalized_before_recording_and_replays_exactly("
          if old_name in tests:
              a = tests.index(old_name)
              b = tests.index(next_name, a)
              block = '''def test_rescue_allows_exact_same_finding_identity_for_two_carried_items() -> None:
              _, rescue = _rescue_turn(2)
              shared = _finding("F1")
              response = ProofReviewModelResponse(
                  action="review",
                  dispositions=(
                      ProofReviewDisposition(
                          item_id="RV1",
                          status="confirmed",
                          explanation="First concern confirmed.",
                          finding=shared,
                      ),
                      ProofReviewDisposition(
                          item_id="RV2",
                          status="revised",
                          explanation="Second concern converges on the same finding.",
                          finding=shared,
                      ),
                  ),
              )

              normalized = validate_proof_review_response(rescue, response)

              assert [item.finding for item in normalized.dispositions] == [shared, shared]


          '''
              tests = tests[:a] + block + tests[b:]

          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Run focused issue 132 tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_proof_review_accounting.py tests/test_issue_132_rescue_finding_accounting.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/proof_language_review.py tests/test_proof_review_accounting.py
          git commit -m "Normalize shared rescue finding identities"
          git push origin HEAD:agent/issue-132-rescue-finding-accounting
