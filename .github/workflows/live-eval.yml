name: Live evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI API model name
        required: true
        type: string
      min_confidence:
        description: Minimum surviving diagnostic confidence
        required: true
        default: "0.65"
        type: string
      case_filter:
        description: Optional case-name or fixture-path substring
        required: false
        default: ""
        type: string

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .
      - name: Run known-case semantic evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THORN_EVAL_MODEL: ${{ inputs.model }}
          THORN_EVAL_MIN_CONFIDENCE: ${{ inputs.min_confidence }}
          THORN_EVAL_CASE_FILTER: ${{ inputs.case_filter }}
        run: |
          set -o pipefail
          args=(
            eval/cases
            --model "$THORN_EVAL_MODEL"
            --min-confidence "$THORN_EVAL_MIN_CONFIDENCE"
          )
          if [[ -n "$THORN_EVAL_CASE_FILTER" ]]; then
            args+=(--case-filter "$THORN_EVAL_CASE_FILTER")
          fi
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            python -c 'import openai,pydantic,pydantic_core; print("openai="+openai.__version__); print("pydantic="+pydantic.__version__); print("pydantic_core="+pydantic_core.__version__)'
            echo "model=$THORN_EVAL_MODEL"
            echo "min_confidence=$THORN_EVAL_MIN_CONFIDENCE"
            echo "case_filter=$THORN_EVAL_CASE_FILTER"
            thorn-eval "${args[@]}"
          } | tee live-eval.txt
      - name: Preserve evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ github.run_id }}
          path: live-eval.txt
          if-no-files-found: error
