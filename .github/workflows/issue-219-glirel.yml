name: Issue 219 GLiREL REQUIRE evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - issue-219-require-relation-eval
    paths:
      - ".github/workflows/issue-219-glirel.yml"
      - "research/dependency-semantics/require_relation_cases.json"
      - "research/dependency-semantics/run_glirel_require_screen.py"
      - "research/dependency-semantics/requirements-glirel.txt"
      - "src/thorn/research/require_relations.py"
      - "tests/test_issue_219_require_relation_corpus.py"
      - "tests/test_issue_219_require_relation_contract.py"

permissions:
  contents: read

jobs:
  glirel-require-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: /tmp/issue-219-hf
    steps:
      - name: Checkout Thorn
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"

      - name: Create isolated research environment
        run: |
          uv venv /tmp/issue-219-venv
          uv pip install \
            --python /tmp/issue-219-venv/bin/python \
            torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install \
            --python /tmp/issue-219-venv/bin/python \
            -r research/dependency-semantics/requirements-glirel.txt

      - name: Run focused GLiREL REQUIRE screen
        run: |
          /tmp/issue-219-venv/bin/python \
            research/dependency-semantics/run_glirel_require_screen.py \
            --output /tmp/issue-219-glirel-measurement.json

      - name: Verify keyless research envelope
        run: |
          /tmp/issue-219-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/issue-219-glirel-measurement.json")
          data = json.loads(path.read_text())
          assert data["issue"] == 219
          assert data["keyless"] is True
          assert data["provider_calls"] == 0
          assert data["authority"].startswith("research-only")
          assert data["benchmark"]["cases"] == 34
          assert data["benchmark"]["reference_occurrences"] == 39
          assert data["model"]["requested_revision"] == (
              "40a523e12a8432d6da364cf2a195a28755ff04d3"
          )
          print(json.dumps(data["endpoint_grounding"], indent=2))
          PY

      - name: Record exact research environment
        run: |
          /tmp/issue-219-venv/bin/python -m pip freeze \
            > /tmp/issue-219-environment.txt

      - name: Upload focused measurement
        uses: actions/upload-artifact@v4
        with:
          name: issue-219-glirel-${{ github.sha }}
          path: |
            /tmp/issue-219-glirel-measurement.json
            /tmp/issue-219-environment.txt
          if-no-files-found: error
