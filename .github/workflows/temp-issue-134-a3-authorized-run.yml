name: TEMP authorized issue 134 A3 paid measurement

on:
  push:
    branches:
      - agent/issue-134-a3-authorized-run-20260819

permissions:
  contents: write

env:
  EVIDENCE_DIR: eval/robustness/issue_134/a3_post137_live_20260819

jobs:
  execute:
    if: ${{ github.event.head_commit.message != 'Preserve authorized A3 evidence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-134-a3-authorized-run-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .

      - name: Keyless frozen preflight
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p "$EVIDENCE_DIR/recordings"
          python scripts/run_issue_134_a3_post137.py \
            --preflight \
            --output "$EVIDENCE_DIR/preflight.json"

      - name: Run single authorized paid A3 measurement
        id: live
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          python scripts/run_issue_134_a3_post137.py \
            --live \
            --record-dir "$EVIDENCE_DIR/recordings" \
            --report "$EVIDENCE_DIR/live.html" \
            --output "$EVIDENCE_DIR/live.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Immediate exact keyless replay
        id: replay
        if: ${{ steps.live.outputs.exit_code == '0' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ''
        run: |
          set +e
          python scripts/run_issue_134_a3_post137.py \
            --replay-dir "$EVIDENCE_DIR/recordings" \
            --report "$EVIDENCE_DIR/replay.html" \
            --output "$EVIDENCE_DIR/replay.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record execution metadata
        if: always()
        run: |
          cat > "$EVIDENCE_DIR/RUN_METADATA.md" <<EOF
          # Authorized A3 live execution

          - GitHub run: ${GITHUB_RUN_ID}
          - Trigger SHA: ${GITHUB_SHA}
          - Frozen assurance revision: 93cba5eec02af0c83bdcc3ea4eb54dd79efb1704
          - Frozen src/thorn tree: 08c1ef7c0d61020424a597be344f0bb08ce10f58
          - Frozen A3 request fingerprint: 44e1ffa1fb17219c106af28f8e7535e70788c1f7a02b5e762bf381e3637cfb28
          - Authorization: explicit user authorization for this single A3 paid run
          - Pricing checked immediately before authorization: GPT-5.6 Sol, USD 5/M input and USD 30/M output
          - Live exit code: ${{ steps.live.outputs.exit_code }}
          - Replay exit code: ${{ steps.replay.outputs.exit_code }}
          EOF

      - name: Upload exact execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-134-a3-authorized-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error

      - name: Preserve evidence on execution branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_DIR"
          git commit -m 'Preserve authorized A3 evidence'
          git push origin HEAD:agent/issue-134-a3-authorized-run-20260819

      - name: Enforce one-shot result
        if: always()
        run: |
          test "${{ steps.live.outputs.exit_code }}" = '0'
          test "${{ steps.replay.outputs.exit_code }}" = '0'
