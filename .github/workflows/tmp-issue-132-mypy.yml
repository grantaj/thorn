name: TEMP issue 132 mypy fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-132-rescue-finding-accounting' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-132-rescue-finding-accounting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Remove finding variable shadowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/thorn/proof_language_review.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for disposition in response.dispositions:\n        finding = disposition.finding\n        if finding is None:\n            continue\n        canonical = top_by_id.get(finding.id)\n        if canonical is not None:\n            if (\n                not _finding_identity_compatible(canonical, finding)\n                and finding.id not in incompatible\n            ):\n                incompatible.append(finding.id)\n            continue\n\n        previous = disposition_only.get(finding.id)\n        if previous is None:\n            disposition_only[finding.id] = finding\n        elif (\n            _canonical_finding_payload(previous)\n            != _canonical_finding_payload(finding)\n            and finding.id not in ambiguous\n        ):\n            ambiguous.append(finding.id)'''
          new = '''    for disposition in response.dispositions:\n        disposition_finding = disposition.finding\n        if disposition_finding is None:\n            continue\n        canonical = top_by_id.get(disposition_finding.id)\n        if canonical is not None:\n            if (\n                not _finding_identity_compatible(canonical, disposition_finding)\n                and disposition_finding.id not in incompatible\n            ):\n                incompatible.append(disposition_finding.id)\n            continue\n\n        previous = disposition_only.get(disposition_finding.id)\n        if previous is None:\n            disposition_only[disposition_finding.id] = disposition_finding\n        elif (\n            _canonical_finding_payload(previous)\n            != _canonical_finding_payload(disposition_finding)\n            and disposition_finding.id not in ambiguous\n        ):\n            ambiguous.append(disposition_finding.id)'''
          if old not in text:
              raise SystemExit('validation block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run static and focused checks
        run: |
          python -m pip install -e '.[dev]'
          mypy src
          pytest -q tests/test_proof_review_accounting.py tests/test_issue_132_rescue_finding_accounting.py tests/test_rejected_replay.py
      - name: Commit type-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/proof_language_review.py
          git commit -m "Avoid rescue finding variable shadowing"
          git push origin HEAD:agent/issue-132-rescue-finding-accounting
