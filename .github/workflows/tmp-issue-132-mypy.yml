name: TEMP issue 132 mypy fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-132-rescue-finding-accounting' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-132-rescue-finding-accounting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Make finding normalization narrowing explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/thorn/proof_language_review.py')
          text = path.read_text(encoding='utf-8')
          old = '''        carried_ids.add(finding.id)\n        canonical = top_by_id.get(finding.id)\n        if canonical is None:\n            canonical = disposition_canonical.setdefault(finding.id, finding)\n        normalized_dispositions.append(\n            disposition.model_copy(update={"finding": canonical})\n        )'''
          new = '''        carried_ids.add(finding.id)\n        canonical_finding: CandidateFinding = top_by_id.get(finding.id) or finding\n        if finding.id not in top_by_id:\n            canonical_finding = disposition_canonical.setdefault(\n                finding.id, canonical_finding\n            )\n        normalized_dispositions.append(\n            disposition.model_copy(update={"finding": canonical_finding})\n        )'''
          if old not in text:
              raise SystemExit('normalization block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run static and focused checks
        run: |
          python -m pip install -e '.[dev]'
          mypy src
          pytest -q tests/test_proof_review_accounting.py tests/test_issue_132_rescue_finding_accounting.py tests/test_rejected_replay.py
      - name: Commit type-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/proof_language_review.py
          git commit -m "Make rescue finding normalization type-safe"
          git push origin HEAD:agent/issue-132-rescue-finding-accounting
