name: Provider readiness canary

on:
  push:
    branches:
      - agent/provider-readiness-canary-post149-20260819

jobs:
  observe-existing-trigger:
    if: ${{ github.event.head_commit.message == 'OBSERVE_EXISTING_PROVIDER_READINESS_TRIGGER_POST149' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      AUTHORIZED_SHA: 69d80c44c9293869d477090bf56172316946f77e
      TARGET_WORKFLOW_NAME: Authorized provider readiness post-149
      RESULT_BRANCH: agent/provider-readiness-canary-post149-20260819
      RESULT_PATH: eval/provider_readiness_post149_trigger_probe.json
    steps:
      - name: Probe exact authorized SHA without provider access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$AUTHORIZED_SHA&per_page=100")"
          printf '%s' "$runs" > /tmp/runs.json
          python - <<'PY'
import base64, json, os, pathlib
runs = json.loads(pathlib.Path('/tmp/runs.json').read_text())
name = os.environ['TARGET_WORKFLOW_NAME']
sha = os.environ['AUTHORIZED_SHA']
matches = [
    {
        'id': r.get('id'),
        'name': r.get('name'),
        'status': r.get('status'),
        'conclusion': r.get('conclusion'),
        'event': r.get('event'),
        'head_sha': r.get('head_sha'),
        'html_url': r.get('html_url'),
        'created_at': r.get('created_at'),
        'updated_at': r.get('updated_at'),
    }
    for r in runs.get('workflow_runs', [])
    if r.get('name') == name and r.get('head_sha') == sha
]
summary = {'authorized_trigger_sha': sha, 'matching_runs': matches}
raw = json.dumps(summary, sort_keys=True, indent=2) + '\n'
pathlib.Path('/tmp/result.json').write_text(raw)
payload = {
    'message': 'Probe post-149 readiness canary trigger',
    'content': base64.b64encode(raw.encode()).decode(),
    'branch': os.environ['RESULT_BRANCH'],
}
pathlib.Path('/tmp/put.json').write_text(json.dumps(payload))
PY
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$RESULT_PATH" \
            --data-binary @/tmp/put.json
