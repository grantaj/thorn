name: Issue 62 mypy fix

on:
  push:
    branches:
      - agent/issue-62-symbol-scope-resolution

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-62-symbol-scope-resolution
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Apply explicit expression narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/thorn/symbol_resolution_ir.py")
          text = path.read_text()
          old = """                for input_proposition in input_premises:\n                    for reverse in (False, True):\n                        old = equality.right if reverse else equality.left\n                        new = equality.left if reverse else equality.right\n                        replacement = _match_exact_replacement(\n                            input_proposition.expression,\n                            conclusion.expression,\n"""
          new = """                for input_proposition in input_premises:\n                    input_expression = input_proposition.expression\n                    if input_expression is None:\n                        continue\n                    for reverse in (False, True):\n                        old = equality.right if reverse else equality.left\n                        new = equality.left if reverse else equality.right\n                        replacement = _match_exact_replacement(\n                            input_expression,\n                            conclusion.expression,\n"""
          if old not in text:
              raise SystemExit("expected substitution matching block not found")
          path.write_text(text.replace(old, new))
          PY
          ruff check src/thorn/symbol_resolution_ir.py
          mypy src
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thorn/symbol_resolution_ir.py
          git commit -m "Narrow substitution input expression for mypy"
          git push origin HEAD:agent/issue-62-symbol-scope-resolution
