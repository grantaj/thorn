name: Issue 62 branch rebase

on:
  push:
    branches:
      - agent/issue-62-symbol-scope-resolution

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-62-symbol-scope-resolution
          fetch-depth: 0
      - name: Rebase onto current main if needed
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main
          git push --force-with-lease origin HEAD:agent/issue-62-symbol-scope-resolution
