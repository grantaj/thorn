name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: thorn-eval eval/cases --validate-only
      - run: python scripts/benchmark_frontends.py --iterations 20 --results 40
      - run: ruff check .
      - run: mypy src
