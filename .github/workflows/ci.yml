name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/issue_101_robustness.py --check
      - run: python scripts/run_issue_101_live.py --preflight --output /tmp/issue-101-preflight.json
      - run: thorn-eval eval/cases --validate-only
      - run: thorn-eval eval/cases --analyze
      - run: thorn --version
      - run: thorn analyze examples/demo.tex --structural-only
      - run: thorn ir examples/demo.tex --structural-only --format json > /tmp/thorn-ir.json
      - run: thorn report examples/demo.tex --structural-only --output /tmp/thorn-report.html
      - name: Exercise keyless onboarding CLI
        run: |
          thorn analyze examples/quickstart/clean/paper.tex --structural-only
          thorn analyze examples/quickstart/structural-problem/paper.tex --structural-only --fail-on never
          thorn report examples/quickstart/clean/paper.tex --structural-only --output /tmp/quickstart-report.html
          thorn graph examples/quickstart/clean/paper.tex --structural-only --output /tmp/quickstart-graph.html
          thorn lean examples/quickstart/clean/paper.tex --structural-only --result thm:main --output /tmp/quickstart.lean
      - run: python scripts/generate_report_demo.py --output /tmp/thorn-report-demo.html
      - run: python scripts/measure_typed_formula_ir.py --output /tmp/typed-formula-ir.json
      - run: python scripts/prepare_proof_review_experiment.py --structural-only --output /tmp/proof-review-inventory.json
      - name: Exercise keyless Lean replay opportunity inventory
        run: |
          python scripts/measure_lean_replay_opportunity.py \
            --structural-only \
            --thorn-revision "$GITHUB_SHA" \
            --output /tmp/lean-replay-opportunity.json >/dev/null
      - run: ruff check .
      - run: mypy src

  issue101-live:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'tmp/issue-101-live-20260818' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Verify repository live API secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Re-run frozen keyless preflight
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/issue-101"
          python scripts/run_issue_101_live.py \
            --preflight \
            --output "$RUNNER_TEMP/issue-101/preflight.json"
      - name: Run authorized frozen paid batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue-101/recordings" "$RUNNER_TEMP/issue-101/reports"
          python scripts/run_issue_101_live.py \
            --live \
            --record-dir "$RUNNER_TEMP/issue-101/recordings" \
            --report-dir "$RUNNER_TEMP/issue-101/reports" \
            --output "$RUNNER_TEMP/issue-101/live.json"
      - name: Verify exact keyless replay
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/issue-101/replay-reports"
          python scripts/run_issue_101_live.py \
            --replay-dir "$RUNNER_TEMP/issue-101/recordings" \
            --report-dir "$RUNNER_TEMP/issue-101/replay-reports" \
            --output "$RUNNER_TEMP/issue-101/replay.json"
      - name: Preserve issue 101 live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-101-live-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-101
          if-no-files-found: error
