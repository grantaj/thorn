name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e '.[dev]'
      - name: Verify provider runtime identity survives wheel installation
        run: |
          rm -rf /tmp/thorn-wheel /tmp/thorn-wheel-venv
          mkdir -p /tmp/thorn-wheel
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/thorn-wheel
          python -m venv /tmp/thorn-wheel-venv
          /tmp/thorn-wheel-venv/bin/python -m pip install \
            -c "$GITHUB_WORKSPACE/constraints/provider-runtime.txt" \
            /tmp/thorn-wheel/thorn_math-*.whl
          (
            cd /tmp
            PYTHONPATH= THORN_CONSTRAINTS="$GITHUB_WORKSPACE/constraints/provider-runtime.txt" \
              /tmp/thorn-wheel-venv/bin/python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          import thorn
          from thorn.providers.execution_contract import (
              current_provider_runtime,
              provider_lock_sha256,
              provider_runtime_matches_lock,
          )

          constraints = Path(os.environ["THORN_CONSTRAINTS"])
          assert provider_lock_sha256() == hashlib.sha256(constraints.read_bytes()).hexdigest()
          runtime = current_provider_runtime()
          expected_names = {
              line.split("==", 1)[0]
              for line in constraints.read_text(encoding="utf-8").splitlines()
              if line
          }
          assert set(runtime.locked_packages) == expected_names
          assert provider_runtime_matches_lock(runtime)
          assert Path(thorn.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          )
      - run: pytest -q
      - run: python scripts/issue_101_robustness.py --check
      - run: thorn-eval eval/cases --validate-only
      - run: thorn-eval eval/cases --analyze
      - run: thorn --version
      - run: thorn analyze examples/demo.tex --structural-only
      - run: thorn ir examples/demo.tex --structural-only --format json > /tmp/thorn-ir.json
      - run: thorn report examples/demo.tex --structural-only --output /tmp/thorn-report.html
      - name: Exercise keyless onboarding CLI
        run: |
          thorn analyze examples/quickstart/clean/paper.tex --structural-only
          thorn analyze examples/quickstart/structural-problem/paper.tex --structural-only --fail-on never
          thorn report examples/quickstart/clean/paper.tex --structural-only --output /tmp/quickstart-report.html
          thorn graph examples/quickstart/clean/paper.tex --structural-only --output /tmp/quickstart-graph.html
          thorn lean examples/quickstart/clean/paper.tex --structural-only --result thm:main --output /tmp/quickstart.lean
      - run: python scripts/generate_report_demo.py --output /tmp/thorn-report-demo.html
      - run: python scripts/measure_typed_formula_ir.py --output /tmp/typed-formula-ir.json
      - run: python scripts/prepare_proof_review_experiment.py --structural-only --output /tmp/proof-review-inventory.json
      - name: Exercise keyless Lean replay opportunity inventory
        run: |
          python scripts/measure_lean_replay_opportunity.py \
            --structural-only \
            --thorn-revision "$GITHUB_SHA" \
            --output /tmp/lean-replay-opportunity.json >/dev/null
      - run: ruff check .
      - run: mypy src

  provider-readiness-authorized-canary:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/provider-readiness-pr-canary-post149' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      THORN_READINESS_MODEL: gpt-5.6
      PRIOR_TRIGGER_SHA: 69d80c44c9293869d477090bf56172316946f77e
      PRIOR_WORKFLOW_NAME: Authorized provider readiness post-149
      CLAIM_PATH: eval/provider_readiness_post149_paid_claim.json
      CLAIM_BRANCH: agent/provider-readiness-pr-canary-post149
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e .
      - name: Refuse if earlier push-trigger canary ever existed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PRIOR_TRIGGER_SHA&per_page=100")"
          printf '%s' "$runs" > /tmp/prior-runs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('/tmp/prior-runs.json').read_text())
          name = os.environ['PRIOR_WORKFLOW_NAME']
          sha = os.environ['PRIOR_TRIGGER_SHA']
          matches = [
              run
              for run in data.get('workflow_runs', [])
              if run.get('name') == name and run.get('head_sha') == sha
          ]
          if matches:
              ids = [run.get('id') for run in matches]
              raise SystemExit(f'prior authorized canary run exists: {ids}')
          PY
      - name: Keyless preflight
        env:
          OPENAI_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/provider-readiness"
          python scripts/provider_readiness_canary.py \
            --preflight \
            --model "$THORN_READINESS_MODEL" \
            --output "$RUNNER_TEMP/provider-readiness/preflight.json"
      - name: Claim the single paid authorization before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib
          claim = {
              'authorization': 'user-authorized post-#149 readiness canary',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'trigger_sha': os.environ['GITHUB_SHA'],
              'model': os.environ['THORN_READINESS_MODEL'],
              'max_provider_calls': 2,
              'retries': 0,
          }
          raw = json.dumps(claim, sort_keys=True, indent=2) + '\n'
          payload = {
              'message': 'Claim single post-149 paid readiness authorization',
              'content': base64.b64encode(raw.encode()).decode(),
              'branch': os.environ['CLAIM_BRANCH'],
          }
          pathlib.Path('/tmp/claim-put.json').write_text(json.dumps(payload))
          PY
          code="$(curl -sS -o /tmp/claim-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$CLAIM_PATH" \
            --data-binary @/tmp/claim-put.json)"
          if [ "$code" != 201 ]; then
            echo "Paid authorization already claimed or claim failed; refusing provider dispatch (HTTP $code)." >&2
            exit 1
          fi
      - name: Authorized bounded synthetic readiness calls
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/provider_readiness_canary.py \
            --live \
            --confirm-paid-readiness-canary \
            --model "$THORN_READINESS_MODEL" \
            --output "$RUNNER_TEMP/provider-readiness/live.json"
      - name: Keyless replay when live evidence exists
        if: always()
        env:
          OPENAI_API_KEY: ""
        run: |
          if [ -f "$RUNNER_TEMP/provider-readiness/live.json" ]; then
            python scripts/provider_readiness_canary.py \
              --replay "$RUNNER_TEMP/provider-readiness/live.json" \
              --output "$RUNNER_TEMP/provider-readiness/replay.json"
          fi
      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-readiness-authorized-post149-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-readiness
          if-no-files-found: error
