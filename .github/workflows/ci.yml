name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: thorn-eval eval/cases --validate-only
      - run: thorn-eval eval/cases --analyze
      - run: thorn analyze examples/demo.tex --structural-only
      - run: thorn ir examples/demo.tex --structural-only --format json > /tmp/thorn-ir.json
      - run: python scripts/measure_typed_formula_ir.py --output /tmp/typed-formula-ir.json
      - run: ruff check .
      - name: Run mypy with diagnostic annotations
        shell: bash
        run: |
          set +e
          mypy src 2>&1 | tee /tmp/mypy.txt
          status=${PIPESTATUS[0]}
          sed -E 's|^([^:]+):([0-9]+): error: (.*)$|::error file=\1,line=\2::\3|' /tmp/mypy.txt
          exit "$status"
