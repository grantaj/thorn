name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e '.[dev]'
      - name: Verify provider identity and default frontend from a clean wheel install
        run: |
          rm -rf /tmp/thorn-wheel /tmp/thorn-wheel-venv
          mkdir -p /tmp/thorn-wheel
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/thorn-wheel
          python -m venv /tmp/thorn-wheel-venv
          /tmp/thorn-wheel-venv/bin/python -m pip install \
            -c "$GITHUB_WORKSPACE/constraints/provider-runtime.txt" \
            /tmp/thorn-wheel/thorn_math-*.whl
          (
            cd /tmp
            PYTHONPATH= THORN_CONSTRAINTS="$GITHUB_WORKSPACE/constraints/provider-runtime.txt" \
              /tmp/thorn-wheel-venv/bin/python -W error::DeprecationWarning - <<'PY'
          import hashlib
          import importlib.metadata
          import os
          import sys
          from pathlib import Path

          import thorn
          from thorn.frontends import DEFAULT_FRONTEND_NAME, get_default_frontend
          from thorn.frontends.tree_sitter_identity import (
              TREE_SITTER_LANGUAGE_PACK_VERSION,
              TREE_SITTER_RUNTIME_VERSION,
          )
          from thorn.providers.execution_contract import (
              current_provider_runtime,
              provider_lock_sha256,
              provider_runtime_matches_lock,
          )

          constraints = Path(os.environ["THORN_CONSTRAINTS"])
          assert provider_lock_sha256() == hashlib.sha256(constraints.read_bytes()).hexdigest()
          runtime = current_provider_runtime()
          expected_names = {
              line.split("==", 1)[0]
              for line in constraints.read_text(encoding="utf-8").splitlines()
              if line
          }
          assert set(runtime.locked_packages) == expected_names
          assert provider_runtime_matches_lock(runtime)
          assert Path(thorn.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert importlib.metadata.version("tree-sitter") == TREE_SITTER_RUNTIME_VERSION
          assert (
              importlib.metadata.version("tree-sitter-language-pack")
              == TREE_SITTER_LANGUAGE_PACK_VERSION
          )
          assert DEFAULT_FRONTEND_NAME == "tree-sitter"
          assert get_default_frontend().name == "tree-sitter"
          PY
          )
          PYTHONPATH= /tmp/thorn-wheel-venv/bin/thorn analyze \
            "$GITHUB_WORKSPACE/examples/demo.tex" --structural-only
      - run: pytest -q
      - run: python scripts/issue_101_robustness.py --check
      - run: thorn-eval eval/cases --validate-only
      - run: thorn-eval eval/cases --analyze
      - run: thorn --version
      - run: thorn analyze examples/demo.tex --structural-only
      - run: thorn ir examples/demo.tex --structural-only --format json > /tmp/thorn-ir.json
      - run: thorn report examples/demo.tex --structural-only --output /tmp/thorn-report.html
      - name: Exercise keyless onboarding CLI
        run: |
          thorn analyze examples/quickstart/clean/paper.tex --structural-only
          thorn analyze examples/quickstart/structural-problem/paper.tex --structural-only --fail-on never
          thorn report examples/quickstart/clean/paper.tex --structural-only --output /tmp/quickstart-report.html
          thorn graph examples/quickstart/clean/paper.tex --structural-only --output /tmp/quickstart-graph.html
          thorn lean examples/quickstart/clean/paper.tex --structural-only --result thm:main --output /tmp/quickstart.lean
      - run: python scripts/generate_report_demo.py --output /tmp/thorn-report-demo.html
      - run: python scripts/measure_typed_formula_ir.py --output /tmp/typed-formula-ir.json
      - run: python scripts/prepare_proof_review_experiment.py --structural-only --output /tmp/proof-review-inventory.json
      - name: Exercise keyless Lean replay opportunity inventory
        run: |
          python scripts/measure_lean_replay_opportunity.py \
            --structural-only \
            --thorn-revision "$GITHUB_SHA" \
            --output /tmp/lean-replay-opportunity.json >/dev/null
      - run: ruff check .
      - run: mypy src
      - name: Materialize frozen issue 198 qualification harness
        run: |
          git fetch origin issue-198-production-qualification issue-198-structural-nlp-production
          mkdir -p eval/robustness/issue_198
          git show origin/issue-198-production-qualification:scripts/prepare_issue_198_qualification.py \
            > scripts/prepare_issue_198_qualification.py
          git show origin/issue-198-production-qualification:eval/robustness/issue_198/qualification_manifest.json \
            > /tmp/issue-198-frozen-manifest.json
          git show origin/issue-198-production-qualification:eval/robustness/issue_198/heldout_diagonal_regular_clean.tex \
            > eval/robustness/issue_198/heldout_diagonal_regular_clean.tex
      - name: Bind frozen issue 198 manifest to candidate source tree
        run: |
          CANDIDATE_REVISION="$(git rev-parse origin/issue-198-structural-nlp-production)"
          export CANDIDATE_REVISION
          python - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          frozen_path = Path('/tmp/issue-198-frozen-manifest.json')
          candidate_path = Path('/tmp/issue-198-candidate-manifest.json')
          frozen = json.loads(frozen_path.read_text(encoding='utf-8'))
          candidate = copy.deepcopy(frozen)
          candidate['production_revision'] = os.environ['CANDIDATE_REVISION']
          expected = copy.deepcopy(frozen)
          expected['production_revision'] = candidate['production_revision']
          assert candidate == expected
          assert candidate['cases'] == frozen['cases']
          assert candidate['production_identity'] == frozen['production_identity']
          assert candidate['review_identity'] == frozen['review_identity']
          candidate_path.write_text(
              json.dumps(candidate, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          test "$(git rev-parse "$CANDIDATE_REVISION:src/thorn")" = \
               "$(git rev-parse HEAD:src/thorn)"
          sha256sum /tmp/issue-198-frozen-manifest.json /tmp/issue-198-candidate-manifest.json
      - name: Install frozen issue 198 local English model
        run: |
          python -m pip install \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Run frozen issue 198 Phase 1
        run: |
          python scripts/prepare_issue_198_qualification.py \
            --manifest /tmp/issue-198-candidate-manifest.json \
            --output /tmp/issue-198-candidate-preflight.json
      - name: Upload frozen issue 198 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-198-candidate-preflight-${{ github.sha }}
          path: |
            /tmp/issue-198-frozen-manifest.json
            /tmp/issue-198-candidate-manifest.json
            /tmp/issue-198-candidate-preflight.json
          if-no-files-found: warn

  tree-sitter-frontend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: python -m pip install -c constraints/provider-runtime.txt -e '.[dev]'
      - name: Verify packaged grammar identity and warning-free runtime
        run: |
          python -W error::DeprecationWarning - <<'PY'
          import importlib.metadata

          from tree_sitter import Language, Parser
          from tree_sitter_language_pack import get_language, get_parser
          from thorn.frontends.tree_sitter_identity import (
              TREE_SITTER_LANGUAGE_PACK_RELEASE,
              TREE_SITTER_LANGUAGE_PACK_VERSION,
              TREE_SITTER_LATEX_REVISION,
              TREE_SITTER_RUNTIME_VERSION,
          )

          assert TREE_SITTER_RUNTIME_VERSION == "0.26.0"
          assert TREE_SITTER_LANGUAGE_PACK_VERSION == "1.14.3"
          assert TREE_SITTER_LANGUAGE_PACK_RELEASE == "df3bcc39862da6972032d7537d49b782a50a25bb"
          assert TREE_SITTER_LATEX_REVISION == "7e0ecdc02926c7b9b2e0c76003d4fe7b0944f957"
          assert importlib.metadata.version("tree-sitter") == TREE_SITTER_RUNTIME_VERSION
          assert (
              importlib.metadata.version("tree-sitter-language-pack")
              == TREE_SITTER_LANGUAGE_PACK_VERSION
          )
          assert isinstance(get_language("latex"), Language)
          assert isinstance(get_parser("latex"), Parser)
          PY
      - name: Frontend and differential conformance
        run: >-
          pytest -q
          tests/test_frontend_conformance.py
          tests/test_frontend_ab.py
          tests/test_tree_sitter_frontend.py
          tests/test_source_projection.py
      - name: Completed semantic-dependency contract
        run: >-
          PYTHONPATH=tests
          pytest -q -p tree_sitter_contract_plugin
          tests/test_semantic_dependency_contract.py
          tests/test_semantic_dependency_selector_contract.py
          tests/test_semantic_dependency_partiality_contract.py
          tests/test_semantic_dependency_project_partiality_contract.py
      - name: Tree-sitter runtime/package measurement
        run: python scripts/measure_tree_sitter_frontend.py --output /tmp/tree-sitter-frontend.json
      - run: ruff check src/thorn/frontend.py src/thorn/frontends tests/test_frontend_conformance.py tests/test_frontend_ab.py tests/test_tree_sitter_frontend.py tests/tree_sitter_contract_plugin.py scripts/measure_tree_sitter_frontend.py
      - run: mypy src
