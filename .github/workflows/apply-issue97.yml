name: Apply issue 97 rescue accounting patch

on:
  push:
    branches:
      - agent/issue-97-rescue-finding-accounting

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'apply issue 97 rescue accounting patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-97-rescue-finding-accounting
          fetch-depth: 0
      - name: Apply bounded source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/thorn/proof_language_review.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    reused = [finding.id for finding in response.findings if finding.id in expected]\n    if reused:\n        raise ProofReviewProtocolError(\n            "new finding reuses a carried review identity: " + ", ".join(reused)\n        )\n'''
          replacement = needle + '''\n    final_finding_ids = [\n        *(\n            disposition.finding.id\n            for disposition in response.dispositions\n            if disposition.finding is not None\n        ),\n        *(finding.id for finding in response.findings),\n    ]\n    seen_finding_ids: set[str] = set()\n    duplicate_finding_ids: list[str] = []\n    for finding_id in final_finding_ids:\n        if finding_id in seen_finding_ids and finding_id not in duplicate_finding_ids:\n            duplicate_finding_ids.append(finding_id)\n        seen_finding_ids.add(finding_id)\n    if duplicate_finding_ids:\n        raise ProofReviewProtocolError(\n            "final response reuses finding identity across rescue accounting: "\n            + ", ".join(duplicate_finding_ids)\n        )\n'''
          if text.count(needle) != 1:
              raise SystemExit('expected rescue-accountability insertion point exactly once')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Add held-out accounting tests
        run: |
          cat > tests/test_proof_review_accounting.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from thorn.llm_proof_language import LLMProofLanguage, ProofLanguageSourceHandle
          from thorn.models import CandidateFinding, FindingCategory, Severity
          from thorn.proof_language_review import (
              ProofLanguageReviewRequest,
              ProofReviewDisposition,
              ProofReviewItem,
              ProofReviewModelResponse,
              ProofReviewProtocolError,
              build_proof_review_turn,
              build_rescue_turn,
              review_proof_language,
              validate_proof_review_response,
          )
          from thorn.providers.replay import RecordingProvider, ReplayProvider


          def _document() -> LLMProofLanguage:
              return LLMProofLanguage(
                  result_identifier="thm:test",
                  lines=(
                      "THORN-PROOF 1",
                      "T0 Q(a)",
                      "C1 Q(a) <- ? @E1",
                      "GOAL G0 T0: Q(a) | open @C1",
                  ),
                  sources=(
                      ProofLanguageSourceHandle(
                          address="E1",
                          ir_identifier="edge:E1",
                          text="By Lemma 4, Q(a).",
                      ),
                      ProofLanguageSourceHandle(
                          address="C1",
                          ir_identifier="claim:C1",
                          text="Therefore Q(a).",
                      ),
                  ),
              )


          def _finding(finding_id: str) -> CandidateFinding:
              return CandidateFinding(
                  id=finding_id,
                  category=FindingCategory.UNSUPPORTED_CLAIM,
                  severity=Severity.ERROR,
                  title=f"Finding {finding_id}",
                  explanation=f"Explanation for {finding_id}.",
                  confidence=0.9,
              )


          def _need(item_count: int = 1) -> ProofReviewModelResponse:
              items = tuple(
                  ProofReviewItem(
                      id=f"RV{index}",
                      kind="concern",
                      summary=f"Carried concern {index}.",
                  )
                  for index in range(1, item_count + 1)
              )
              return ProofReviewModelResponse(
                  action="need_source",
                  source_addresses=("E1",),
                  review_items=items,
                  source_review_item_ids=tuple(item.id for item in items),
              )


          def _rescue_turn(item_count: int = 1):
              request = ProofLanguageReviewRequest(document=_document())
              initial = build_proof_review_turn(request)
              return request, build_rescue_turn(request, initial, _need(item_count))


          class _Transport:
              def __init__(self, responses: list[ProofReviewModelResponse]) -> None:
                  self.model = "test-model"
                  self.responses = list(responses)
                  self.requests = 0
                  self.live_requests = 0
                  self.replay_hits = 0
                  self.input_tokens = 0
                  self.output_tokens = 0
                  self.total_tokens = 0

              def review_proof_turn(self, request):
                  self.requests += 1
                  self.live_requests += 1
                  return self.responses.pop(0)


          @pytest.mark.parametrize("status", ["confirmed", "revised"])
          def test_rescue_rejects_finding_repeated_in_disposition_and_new_findings(
              status: str,
          ) -> None:
              _, rescue = _rescue_turn()
              duplicated = _finding("F1")
              response = ProofReviewModelResponse(
                  action="review",
                  findings=(duplicated,),
                  dispositions=(
                      ProofReviewDisposition(
                          item_id="RV1",
                          status=status,
                          explanation="The carried concern is settled.",
                          finding=duplicated,
                      ),
                  ),
              )

              with pytest.raises(
                  ProofReviewProtocolError,
                  match="reuses finding identity across rescue accounting: F1",
              ):
                  validate_proof_review_response(rescue, response)


          def test_rescue_preserves_carried_and_genuinely_new_findings_once() -> None:
              request = ProofLanguageReviewRequest(document=_document())
              transport = _Transport(
                  [
                      _need(),
                      ProofReviewModelResponse(
                          action="review",
                          findings=(_finding("F2"),),
                          dispositions=(
                              ProofReviewDisposition(
                                  item_id="RV1",
                                  status="confirmed",
                                  explanation="The carried concern is confirmed.",
                                  finding=_finding("F1"),
                              ),
                          ),
                      ),
                  ]
              )

              report = review_proof_language(request, transport)
              assert [finding.id for finding in report.findings] == ["F1", "F2"]


          def test_multiple_carried_items_keep_distinct_finding_identities() -> None:
              request = ProofLanguageReviewRequest(document=_document())
              transport = _Transport(
                  [
                      _need(2),
                      ProofReviewModelResponse(
                          action="review",
                          dispositions=(
                              ProofReviewDisposition(
                                  item_id="RV1",
                                  status="confirmed",
                                  explanation="First concern confirmed.",
                                  finding=_finding("F1"),
                              ),
                              ProofReviewDisposition(
                                  item_id="RV2",
                                  status="revised",
                                  explanation="Second concern revised.",
                                  finding=_finding("F2"),
                              ),
                          ),
                      ),
                  ]
              )

              report = review_proof_language(request, transport)
              assert [finding.id for finding in report.findings] == ["F1", "F2"]


          def test_rescue_rejects_same_finding_identity_for_two_carried_items() -> None:
              _, rescue = _rescue_turn(2)
              response = ProofReviewModelResponse(
                  action="review",
                  dispositions=(
                      ProofReviewDisposition(
                          item_id="RV1",
                          status="confirmed",
                          explanation="First concern confirmed.",
                          finding=_finding("F1"),
                      ),
                      ProofReviewDisposition(
                          item_id="RV2",
                          status="revised",
                          explanation="Second concern revised.",
                          finding=_finding("F1"),
                      ),
                  ),
              )

              with pytest.raises(
                  ProofReviewProtocolError,
                  match="reuses finding identity across rescue accounting: F1",
              ):
                  validate_proof_review_response(rescue, response)


          def test_duplicate_rescue_finding_replay_is_rejected_identically(
              tmp_path: Path,
          ) -> None:
              request = ProofLanguageReviewRequest(document=_document())
              duplicated = _finding("F1")
              final = ProofReviewModelResponse(
                  action="review",
                  findings=(duplicated,),
                  dispositions=(
                      ProofReviewDisposition(
                          item_id="RV1",
                          status="confirmed",
                          explanation="Concern confirmed.",
                          finding=duplicated,
                      ),
                  ),
              )
              recorder = RecordingProvider(_Transport([_need(), final]), tmp_path)

              with pytest.raises(
                  ProofReviewProtocolError,
                  match="reuses finding identity across rescue accounting: F1",
              ):
                  review_proof_language(request, recorder)
              assert len(tuple(tmp_path.glob("*.json"))) == 2

              replay = ReplayProvider("test-model", tmp_path)
              with pytest.raises(
                  ProofReviewProtocolError,
                  match="reuses finding identity across rescue accounting: F1",
              ):
                  review_proof_language(request, replay)
              assert replay.requests == 2
              assert replay.replay_hits == 2
              assert replay.live_requests == 0
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/thorn/proof_language_review.py tests/test_proof_review_accounting.py
          git commit -m "enforce unique rescue finding accounting"
          git push origin HEAD:agent/issue-97-rescue-finding-accounting
