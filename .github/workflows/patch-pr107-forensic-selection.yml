name: Apply PR 107 forensic selection fix

on:
  push:
    branches:
      - agent/issue-105-quarantined-replay

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'apply forensic replay selection precedence fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-105-quarantined-replay
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          replay = Path('src/thorn/providers/replay.py')
          text = replay.read_text()
          old_doc = '    """Replay accepted turns normally and explicit quarantined failures for diagnosis."""'
          new_doc = '    """Replay accepted turns normally or explicitly selected quarantined failures."""'
          if old_doc not in text:
              raise SystemExit('forensic provider docstring anchor not found')
          text = text.replace(old_doc, new_doc, 1)

          old_method = dedent('''\
              def review_proof_turn(
                  self,
                  request: ProofReviewTurnRequest,
              ) -> ProofReviewModelResponse:
                  try:
                      return super().review_proof_turn(request)
                  except ReplayMissError:
                      pass

                  envelope = proof_review_request_envelope(request, self.model)
                  exchange = self._load_rejected(envelope)
          ''')
          new_method = dedent('''\
              def review_proof_turn(
                  self,
                  request: ProofReviewTurnRequest,
              ) -> ProofReviewModelResponse:
                  envelope = proof_review_request_envelope(request, self.model)
                  fingerprint = envelope.fingerprint()
                  if fingerprint not in self.rejected_response_fingerprints:
                      try:
                          return super().review_proof_turn(request)
                      except ReplayMissError:
                          pass

                  exchange = self._load_rejected(envelope)
          ''')
          old_method = ''.join('    ' + line if line.strip() else line for line in old_method.splitlines(keepends=True))
          new_method = ''.join('    ' + line if line.strip() else line for line in new_method.splitlines(keepends=True))
          if old_method not in text:
              raise SystemExit('forensic review method anchor not found')
          replay.write_text(text.replace(old_method, new_method, 1))

          tests = Path('tests/test_rejected_replay.py')
          test_text = tests.read_text()
          addition = dedent('''\


              def test_explicit_forensic_selection_overrides_accepted_recording_for_same_request(
                  tmp_path: Path,
              ) -> None:
                  _, _, rescue = _turns()
                  accepted_response = ProofReviewModelResponse(
                      action="review",
                      dispositions=(
                          ProofReviewDisposition(
                              item_id="RV1",
                              status="discharged",
                              explanation="The carried concern is discharged.",
                          ),
                      ),
                  )
                  accepted_recorder = RecordingProvider(_Transport([accepted_response]), tmp_path)
                  assert accepted_recorder.review_proof_turn(rescue) == accepted_response

                  rejected_recorder = RecordingProvider(
                      _Transport([_conflicting_response()]),
                      tmp_path,
                  )
                  with pytest.raises(
                      ProofReviewProtocolError,
                      match="reuses finding identity across rescue accounting: F1",
                  ):
                      rejected_recorder.review_proof_turn(rescue)

                  normal = ReplayProvider("test-model", tmp_path)
                  assert normal.review_proof_turn(rescue) == accepted_response
                  assert normal.replay_hits == 1
                  assert normal.live_requests == 0

                  rejected = _rejected_paths(tmp_path, rescue)
                  assert len(rejected) == 1
                  request_fingerprint = proof_review_request_envelope(rescue, "test-model").fingerprint()
                  forensic = ForensicReplayProvider(
                      "test-model",
                      tmp_path,
                      rejected_response_fingerprints={request_fingerprint: rejected[0].stem},
                  )
                  with pytest.raises(
                      ProofReviewProtocolError,
                      match="reuses finding identity across rescue accounting: F1",
                  ):
                      forensic.review_proof_turn(rescue)
                  assert forensic.replay_hits == 0
                  assert forensic.forensic_hits == 1
                  assert forensic.live_requests == 0
          ''')
          if 'test_explicit_forensic_selection_overrides_accepted_recording_for_same_request' in test_text:
              raise SystemExit('regression test already exists')
          tests.write_text(test_text.rstrip() + addition + '\n')
          PY

      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          pytest tests/test_rejected_replay.py -q
          ruff check src/thorn/providers/replay.py tests/test_rejected_replay.py

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-pr107-forensic-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/thorn/providers/replay.py tests/test_rejected_replay.py .github/workflows/patch-pr107-forensic-selection.yml
          git commit -m 'fix forensic replay explicit selection precedence'
          git push origin HEAD:agent/issue-105-quarantined-replay
